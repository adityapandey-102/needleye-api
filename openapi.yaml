openapi: 3.0.3
info:
  title: Needle Eye API
  version: 0.1.0
  description: |
    Express + TypeScript backend for the Needle Eye boutique/tailoring ERP.
    Stateless REST: every request carries its own bearer token, verified
    independently -- nothing about a client's session is stored server-side
    between requests. `needleye-web` never talks to Supabase directly; every
    auth operation goes through the `/auth/*` endpoints documented here.

    See the repo README for the layered architecture (Controller ->
    Validation -> Service -> Repository -> Mapper) and the Mermaid flow-map
    diagrams -- this document covers the *what* (request/response contracts),
    the README's Flow Map section covers the *how* (which function calls
    which).
  contact:
    name: Needle Eye API
servers:
  - url: http://localhost:4000/api/v1
    description: Local dev
tags:
  - name: Auth
    description: Login, session refresh, password reset, bootstrap -- everything needleye-web needs instead of talking to Supabase directly.
  - name: Users
    description: Owner/Manager-only staff administration -- direct account creation with a generated password (no email invite), password/QR-login regeneration, role changes, deactivation.
  - name: Orders
    description: Order CRUD, field-level RBAC, image uploads.
  - name: Payments
    description: Per-order payment ledger. owner_manager/accountant see and manage every order's ledger; designer only their own assigned orders; master_tailor has zero access, enforced at every layer (router capability gate, RLS, and the response never includes payment fields at all).
  - name: Reports
    description: Owner/Manager-only view of the team -- who is Working vs Idle, and the last 7 days of staff activity from the audit trail (payments excluded).
  - name: Team Members
    description: Lightweight designer/master-tailor lookup, backs selects and filters.
  - name: Leads
    description: Customer enquiries worked by designers until they become orders (ADR 0007). The owner sees every lead; a designer only their own.
  - name: Public
    description: The public enquiry form -- the only unauthenticated write. Rate-limited, strictly validated, 8 kB body limit (ADR 0007).
  - name: Ledger
    description: The Revenue page's numbers -- calendar months from the daily ledger the database keeps (ADR 0008, phase 4) -- plus closing the books and the check that the register matches the receipts (phase 5). Owner and Accountant (reports:financial).

security:
  - bearerAuth: []

paths:
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current caller's profile
      description: |
        Verifies the bearer token against Supabase Auth, then loads the
        matching `profiles` row. Every page in needleye-web calls this once
        (server-side, in `app/(app)/layout.tsx`) to know who's logged in and
        what role they have.
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/bootstrap-status:
    get:
      tags: [Auth]
      summary: Whether an Owner/Manager account already exists
      description: Drives the frontend's `/register` page -- shows the first-time-setup form if `ownerExists` is false, an "invite-only" message otherwise.
      security: []
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ownerExists:
                    type: boolean

  /auth/bootstrap:
    post:
      tags: [Auth]
      summary: Create the first Owner/Manager account
      description: |
        Self-disabling: throws 403 the instant one Owner/Manager already
        exists, so it can never be used to self-escalate after go-live.
        Every account after this one is created directly via `POST /users`
        (no email invite -- a password is generated and returned once).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                fullName: { type: string, minLength: 1 }
      responses:
        "201":
          description: Owner/Manager account created
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean, enum: [true] } }
        "403":
          description: An Owner/Manager already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email + password
      description: |
        The only place needleye-web sends a raw password. Returns a fresh
        session; if the account turns out to be inactive, the session is
        immediately revoked again server-side before the error is returned --
        a deactivated user never walks away holding a live token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token for a new session
      description: |
        Called by needleye-web's `proxy.ts` (on every request, if the access
        token is missing/expired) and by `lib/api/client.ts`/`lib/api/server.ts`
        before any API call whose token has expired. Supabase rotates the
        refresh token itself on every use -- the old one stops working the
        moment a new one is issued.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      description: |
        Real server-side revocation (`auth.admin.signOut`), not just "the
        client forgets the token" -- a refresh attempt with the same token
        after this call fails with 401. Best-effort: an already-invalid token
        is not treated as an error.
      responses:
        "204": { description: Session revoked }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/password-reset-request:
    post:
      tags: [Auth]
      summary: Request a password-reset email
      description: |
        Always returns 204, whether or not the email matches an account --
        never confirms account existence. The email's link points at
        `${WEB_APP_URL}/auth/callback?next=/update-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "204": { description: Always -- see description }

  /auth/password-update:
    post:
      tags: [Auth]
      summary: Update the caller's own password
      description: Requires a bearer token (either a normal session, or the session established right after following a password-reset email link).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties: { newPassword: { type: string, minLength: 8 } }
      responses:
        "204": { description: Password updated }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/exchange-code:
    post:
      tags: [Auth]
      summary: Exchange a PKCE code for a session
      description: |
        Only exercised if the Supabase project is configured for the PKCE
        flow (a `?code=` query param on the email link). This project's
        current config uses the *implicit* flow instead (tokens arrive
        directly in the URL fragment), which `app/auth/callback/page.tsx`
        handles client-side without calling this endpoint -- it's kept for
        if that configuration ever changes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid or expired code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/qr-login:
    post:
      tags: [Auth]
      summary: Sign in via a staff QR login card
      description: |
        Public -- the token comes from the `?token=` query param on the
        scanned QR's URL (`${WEB_APP_URL}/qr-login?token=...`). Internally
        looks up the token's hash against `qr_login_tokens`, then mints a
        real session via Supabase's admin `generateLink` + `verifyOtp`
        (the magic link is never emailed, just redeemed server-side
        immediately) -- see the README's Flow Map. Only ever issued for
        `designer`, `master_tailor`, `production_manager` and `worker`
        accounts (never owner/accountant), so this endpoint needs no role
        check of its own; deactivating an account or regenerating
        its QR immediately invalidates the old token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid, expired, or revoked QR code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users:
    get:
      tags: [Users]
      summary: List staff accounts (searchable, paginated)
      description: |
        Owner/Manager only (`users:manage`). Server-side offset pagination and
        search (never loads every account into the client), mirroring the
        Orders list: the response is a bounded envelope
        (`{ users, total, limit, offset }`). `search` matches full name OR
        email, case-insensitively.
      parameters:
        - { in: query, name: search, schema: { type: string }, description: "Case-insensitive match on name or email" }
        - { in: query, name: limit, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: "Clamped to 1-100" }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                required: [users, total, limit, offset]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  total: { type: integer, description: "Full count matching the search, for the pager." }
                  limit: { type: integer }
                  offset: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Users]
      summary: Create a staff account directly
      description: |
        Owner/Manager only. No email invite -- the account is created with a
        real password immediately (generated as "readable name + random
        suffix", e.g. `Aditya-9kQ2Xf7q`), returned once in this response.
        The Owner/Manager is responsible for communicating it to the new
        hire. The `handle_new_user()` DB trigger reads `full_name`/`role`
        from the created user's metadata and creates the matching `profiles`
        row automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName, role]
              properties:
                email: { type: string, format: email }
                fullName: { type: string, minLength: 1 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  password: { type: string, description: "Shown only in this response -- never retrievable again." }
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/generate-password:
    post:
      tags: [Users]
      summary: Regenerate a staff member's password
      description: |
        Owner/Manager only. Always allowed for `designer`/`master_tailor`
        accounts. For `owner_manager`/`accountant` accounts, only allowed
        until that account's first real login (`profiles.last_login_at`) --
        after that they're expected to manage their own password via
        `POST /auth/password-reset-request` instead. The new password is
        returned once, same as account creation.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: Password regenerated
          content:
            application/json:
              schema:
                type: object
                properties: { password: { type: string } }
        "403":
          description: "This owner_manager/accountant account has already completed its first login"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/qr-token:
    post:
      tags: [Users]
      summary: Generate (or regenerate) a staff member's QR login card
      description: |
        Owner/Manager only, and only for `designer`, `master_tailor`,
        `production_manager` and `worker` accounts -- 400 for `owner_manager`
        and `accountant`, whose pricing/payment/staff powers aren't worth
        exposing to a lost or photographed card. The QR card is an extra way
        in; the account's password login is unaffected. Only the token's
        SHA-256 hash is stored
        (`qr_login_tokens`, a table with no anon/authenticated grant at
        all -- unreachable except through this API's service-role client).
        The raw token/URL is returned once; regenerating immediately
        invalidates whatever QR code was printed/displayed before.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: QR login token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  loginUrl: { type: string, example: "http://localhost:3000/qr-login?token=..." }
        "400":
          description: "`USER_QR_ROLE_UNSUPPORTED` -- the target account is an owner_manager or accountant"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}:
    get:
      tags: [Users]
      summary: Fetch a single staff account
      description: Owner/Manager only. Backs the user detail / management page.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Users]
      summary: Update a staff member's name, role, or active flag
      description: Owner/Manager only. All fields optional; at least one is required.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, minLength: 1 }
                role: { $ref: "#/components/schemas/Role" }
                active: { type: boolean }
      responses:
        "204": { description: Updated }
        "400":
          description: No fields to update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/deactivate:
    post:
      tags: [Users]
      summary: Deactivate a staff member
      description: |
        Owner/Manager only. Sets `profiles.active = false` AND bans the
        account at the Supabase Auth layer (`ban_duration`), so the block is
        enforced at sign-in, not just app-level. Also clears any QR login
        token immediately -- a deactivated account's QR must stop working
        right away, not linger. Rejects self-deactivation.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Deactivated }
        "400":
          description: You cannot deactivate your own account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/reactivate:
    post:
      tags: [Users]
      summary: Reactivate a deactivated staff member
      description: |
        Owner/Manager only. Sets `profiles.active = true` AND lifts the
        Supabase Auth ban applied by deactivation, restoring sign-in. Any QR
        login must be re-issued separately (deactivation cleared the old one).
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Reactivated }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    get:
      tags: [Orders]
      summary: List orders (row-scoped by role, paginated)
      description: |
        Owner/Manager and Accountant see every order; Designer and Master
        Tailor only ever see orders where they're `designerId`/`masterTailorId`
        -- enforced inside the repository's query construction, not just a
        UI filter.

        Offset-paginated: the response is a bounded envelope
        (`{ orders, total, limit, offset }`), not a bare array. `total` is the
        full count matching the filters, for building a pager. `limit` defaults
        to 20 and is capped at 100; `offset` defaults to 0.
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/GranularStatus" }
        - name: designerId
          in: query
          schema: { type: string, format: uuid }
        - name: masterTailorId
          in: query
          schema: { type: string, format: uuid }
        - name: bucket
          in: query
          description: |
            Dashboard filter a summary card deep-links into. One of:
            `active`, `production` (Falls/Kutchu..Alteration), `completed`,
            `ready` (in Ready now), `delivered`, `delivered_this_month`
            (reached Delivered since the 1st, shop timezone), `pending_payment`,
            `payment_overdue`, `payment_upcoming`, `overdue`, `urgent`,
            `this_month` (booked since the 1st, shop timezone), `not_priced`
            (no price yet). The payment buckets only count orders that still
            owe (unpaid / advance_paid).
            Unknown values are ignored (no filtering).
          schema:
            type: string
            enum: [active, production, completed, ready, delivered, delivered_this_month, pending_payment, payment_overdue, payment_upcoming, overdue, urgent, this_month, not_priced]
        - name: limit
          in: query
          description: Page size. Defaults to 20, clamped to a maximum of 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          description: Number of orders to skip. Defaults to 0.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: createdFrom
          in: query
          description: >
            Only orders created on or after this day (midnight in the shop's
            timezone, BUSINESS_TIMEZONE). The web's Kanban board sends today
            minus 2 months with limit=50 to page through the recent board. A
            date that isn't real (e.g. 2026-02-31) is a 400.
          schema: { type: string, format: date }
        - name: dueOn
          in: query
          description: >
            Only orders DUE on this day -- the delivery calendar's list of one
            day's deliveries (owner / production manager dashboard). Row-scoped
            like the rest of the list. A date that isn't real is a 400.
          schema: { type: string, format: date }
      responses:
        "200":
          description: A page of orders visible to the caller, plus the total count
          content:
            application/json:
              schema:
                type: object
                required: [orders, total, limit, offset]
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/OrderListItem" }
                  total:
                    type: integer
                    description: Total orders matching the filters, ignoring pagination.
                  limit: { type: integer }
                  offset: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Orders]
      summary: Create an order
      description: |
        Owner/Manager, Designer and Production Manager (`orders:create`).

        **Delivery-day capacity.** If `DELIVERY_DAY_CAPACITY` (default 10)
        orders are already due on `dueDate`, the create is refused with 409
        `DELIVERY_DAY_FULL` unless `confirmedWithProductionManager: true` is
        sent -- in which case it's booked and audited as
        `order.delivery_override`. The check and the insert run under a
        per-date lock, so two people booking a day's last slot at once can't
        both get it. See `GET /orders/delivery-load`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties: { order: { $ref: "#/components/schemas/Order" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            `DELIVERY_DAY_FULL` -- the due date is at capacity and
            `confirmedWithProductionManager` wasn't sent. `details` carries
            `{ dueDate, booked, capacity }`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/delivery-load:
    get:
      tags: [Orders]
      summary: Orders due per day -- for the delivery calendar and availability check
      description: |
        How many orders are due on each day in `[from, to]`, SHOP-WIDE: not
        row-scoped, because delivery capacity is shop-wide and this returns only
        counts, never order details. Days with no orders are omitted (read a
        missing day as 0). `capacity` / `nearCapacity` come from the server so
        clients never hard-code them: a day at or above `capacity` is full
        (red), at or above `nearCapacity` is filling up (amber), otherwise open.
        Gated on `orders:create` -- the roles that pick due dates. A malformed
        or over-long range is a 400 rather than silently defaulted.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: "Inclusive; at most 200 days after `from`.", schema: { type: string, format: date } }
        - { name: excludeOrderId, in: query, required: false, description: "Leave one order out of the counts -- the order being edited, so it doesn't count against its own day.", schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Per-day counts plus thresholds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryLoad" }
        "400":
          description: Not a real date, `to` before `from`, or a span over 200 days
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/stats:
    get:
      tags: [Orders]
      summary: Dashboard aggregates for the caller's row scope
      description: |
        Registered before `/orders/{id}` -- Express would otherwise match
        `stats` as `:id`. Counts/sums are computed in Postgres (COUNT/SUM
        FILTER), never by fetching every order into Node. `pendingPayments`,
        `collectedRevenue`, and `outstandingRevenue` are absent entirely
        (not zero) for callers without `payments:read` (master_tailor) --
        the same real server-side omission `Order`'s own payment fields get.
      responses:
        "200":
          description: Aggregates scoped to the caller's role (row-scoped the same way GET /orders is)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderStats" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/staff-report:
    get:
      tags: [Orders]
      summary: One designer/master-tailor's weekly workload report
      description: |
        Owner/Manager only (`reports:staff` -- NOT the accountant). Loads ONE
        person's report on demand (the UI drills down role -> person -> here),
        so all-staff aggregation never runs. Computed live from `orders`
        (+ `order_status_history` for weekly completion) over a rolling window;
        nothing is stored/deleted. Registered before `/orders/{id}` so
        `staff-report` isn't matched as an order id.
      parameters:
        - name: staffId
          in: query
          required: true
          description: An ACTIVE designer or master_tailor profile id.
          schema: { type: string, format: uuid }
        - name: month
          in: query
          description: The month (YYYY-MM) the weekly breakdown covers. Defaults to the current month; the UI offers the last 6 months and fetches per selection.
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: The staff report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffReport" }
        "400":
          description: staffId is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No active designer/master_tailor with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/ledger-events:
    get:
      tags: [Orders]
      summary: Payment-ledger activity feed (audit trail)
      description: |
        Owner/Manager and Accountant only (`reports:financial`). The
        append-only payment audit trail over an inclusive `[from, to]` window:
        every payment recorded / edited / removed, newest first, decoded into a
        display shape (who did it, when, on which order, and what changed --
        before/after amounts for an edit, a signed amount for a
        record/removal). Read from `audit_log` (`entity_type = 'payment'`);
        nothing is mutated. Paginated (the revenue page's year/month/week
        filters map to a `[from, to]` here). Registered before `/orders/{id}`
        so `ledger-events` isn't matched as an order id. Defaults to the last
        12 months when the range is missing/invalid. Days are the shop's days
        (`BUSINESS_TIMEZONE`), not UTC's.
      parameters:
        - name: from
          in: query
          description: Inclusive start date (YYYY-MM-DD). Defaults to the first of the month 11 months ago.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive end date (YYYY-MM-DD). Defaults to today.
          schema: { type: string, format: date }
        - name: limit
          in: query
          description: Page size (default 20, max 100).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          description: Rows to skip for pagination.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The ledger-activity feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEventsResult" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/ledger-events/export:
    get:
      tags: [Orders]
      summary: Ledger Activity export -- one week or one month, unpaged
      description: |
        Owner/Manager and Accountant only (`reports:financial`). Every ledger
        event of the window in ONE response (same rows and shape as
        `/orders/ledger-events`, newest first) -- the web builds the CSV from
        it and renders the printable PDF page. Weekly/monthly only: both dates
        are required and real, and a window longer than 31 days (e.g. a year)
        is refused with `LEDGER_EXPORT_RANGE_INVALID`. A window holding more
        than 5000 entries is refused with `LEDGER_EXPORT_TOO_LARGE` rather
        than returning a partial file. Shop-timezone days. No new storage --
        it reads the existing `audit_log`.
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive start date (YYYY-MM-DD) -- the week's Monday or the month's 1st.
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          description: Inclusive end date (YYYY-MM-DD), at most 31 days after `from` counting both ends.
          schema: { type: string, format: date }
      responses:
        "200":
          description: Every ledger event in the window (`limit` = the row ceiling, `offset` = 0) plus the shop `timeZone`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerExportResult" }
        "400":
          description: "`LEDGER_EXPORT_RANGE_INVALID` (missing/fake/backwards dates, or longer than 31 days) or `LEDGER_EXPORT_TOO_LARGE`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get a single order
      description: |
        In-scope readers (owner/accountant on any order; a designer/master on
        their own) get the full order. An authenticated OUTSIDER (a
        designer/master reaching a non-assigned order via QR/link) gets a
        read-only view -- the same 200, but payment fields
        (paymentStatus/totalAmount/amountPaid/outstanding) are stripped, and
        writes (status/edit/payment ledger) stay 403. A truly missing order is
        404. The list endpoint stays row-scoped -- outsiders can reach one order
        by id, not browse everyone's.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                type: object
                properties: { order: { $ref: "#/components/schemas/Order" } }
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Orders]
      summary: Edit an order
      description: |
        The core field-level RBAC: customer/product fields
        (`orders:edit:customer_product_fields`) and reassignment
        (`designerId`, `masterTailorId`, gated by
        `orders:edit:pricing_assignment`, owner only) are checked
        *independently* -- a Designer can edit their own order's notes but
        gets 403 reassigning its designer or master tailor.
        `productionStatus` is accepted by the request schema but silently
        stripped by the controller -- status changes go through
        `PATCH /orders/{id}/status`.

        **The price never changes here (ADR 0008).** `totalAmount` may be
        resent UNCHANGED (edit forms send every field) and is then ignored; a
        different value is refused with 400 `ORDER_PRICE_USE_PRICING` -- use
        `PUT /orders/{id}/price`.

        Moving `dueDate` onto a day already at capacity is refused with 409
        `DELIVERY_DAY_FULL` unless `confirmedWithProductionManager: true` is
        sent (then audited as `order.delivery_override`). Resending the order's
        CURRENT due date is never checked -- clients send every field on edit,
        and an order already on a full day must stay editable.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderRequest" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                type: object
                properties: { order: { $ref: "#/components/schemas/Order" } }
        "400":
          description: "No editable fields, or a changed totalAmount (ORDER_PRICE_USE_PRICING -- prices change only via PUT /orders/{id}/price)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `ORDER_MODIFIED` -- `version` no longer matches (someone else edited
            first); or `DELIVERY_DAY_FULL` -- the new due date is at capacity and
            `confirmedWithProductionManager` wasn't sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Change an order's production status
      description: |
        Tiered stage RBAC, not the flat `orders:edit:*` capabilities. Each stage
        belongs to one capability tier, and the caller's ROLE alone decides
        whether they may move an order into it -- assignment is never
        considered (whoever receives the garment on the floor advances it):

        | Tier | Stages | Roles |
        |---|---|---|
        | `orders:status:design` | Design Pending, Design Approved | owner, designer, PM |
        | `orders:status:pm_received` | Production Manager Received | owner, PM |
        | `orders:status:production` | Falls/Kutchu ... Finishing (incl. Dyeing, Marking) | owner, designer, PM, master tailor, worker |
        | `orders:status:finalization` | Quality Check / Trail, Alteration, Ready, Delivered | owner, designer, PM |

        **No skipping past a gated stage.** A forward jump may pass over
        intermediate stages only if the caller could have set each of them --
        so a designer can't go Design Approved -> Falls/Kutchu over PM Received,
        but anyone can skip Hand Work on an order that doesn't need it.

        **Forward-only, with one loop (ADR 0008).** Moving to the current or an
        earlier stage is a 409 -- except **Ready -> Alteration**, so a garment
        can go Ready -> Alteration -> Ready as often as needed. **Delivered only
        from Ready** (409 `ORDER_DELIVER_REQUIRES_READY`; a database trigger
        enforces it too). The order row is locked for the whole
        check-and-write, so two people advancing the same order at once
        serialise (the loser gets the 409), and the flow + no-skip checks run
        against the locked stage.

        Deliberately not gated by a `requireCapability` middleware call -- the
        capability depends on the *target* status in the body -- so the
        decision lives in the domain layer (`order-status.rules.ts`:
        `assertCanChangeStage` + `assertCanSkipStages`). Appends one row to the
        order's status history in the same transaction as the update.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatusRequest" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                type: object
                properties: { order: { $ref: "#/components/schemas/Order" } }
        "403":
          description: >-
            `ORDER_STATUS_TRANSITION_FORBIDDEN` -- the caller's role can't set the
            target stage, or the move would skip over a stage it can't set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `ORDER_STATUS_NOT_FORWARD` -- the target is the order's current stage
            or an earlier one other than Ready -> Alteration (also what the loser
            of a concurrent advance gets). `ORDER_DELIVER_REQUIRES_READY` -- the
            target is Delivered but the order isn't in Ready.
            `ORDER_PRICE_REQUIRED` -- the target is Delivered but the order has
            no price yet ("Set the order total first").
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}/price:
    put:
      tags: [Orders]
      summary: Set, raise or discount an order's price
      description: |
        The ONLY way an order's total changes (ADR 0008). The server decides
        what the request means from the order's state, read under its row
        lock in the same transaction that writes the change and its
        `order_price_history` row:

        | Order now | New total | Kind | Who | Reason |
        |---|---|---|---|---|
        | no price | any (Rs 0 = intentional free work) | `set` | the order's own designer, owner, accountant | optional |
        | priced | higher | `raise` | owner, accountant | required (3-500 chars) |
        | priced | lower | `discount` | owner, accountant | required; never below what's collected |

        Refused: 403 `ORDER_PRICE_FORBIDDEN` (role / not your order), 409
        `ORDER_PRICE_LOCKED` (delivered), 400 `ORDER_PRICE_UNCHANGED`,
        `ORDER_PRICE_REASON_REQUIRED`, `ORDER_TOTAL_BELOW_PAID` (the message
        states the largest discount possible). The payment status is
        re-derived; a discount down to what's collected settles the order
        (fully_paid, next payment date cleared). Database triggers refuse a
        locked or below-collected price on any other write path too.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePriceRequest" }
      responses:
        "200":
          description: The repriced order and the price-history row just written
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: "#/components/schemas/Order" }
                  change: { $ref: "#/components/schemas/PriceChange" }
        "400":
          description: ORDER_PRICE_UNCHANGED, ORDER_PRICE_REASON_REQUIRED, ORDER_TOTAL_BELOW_PAID, or validation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: ORDER_PRICE_FORBIDDEN -- this role can't make this kind of change (or it isn't their order)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: ORDER_PRICE_LOCKED -- the order is delivered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}/price-history:
    get:
      tags: [Orders]
      summary: An order's price history (set / raise / discount), newest first
      description: For roles that can see order money (`payments:read`), on orders in their row scope (a designer, their own; 404 otherwise). 403 for the PM, master tailor and worker.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Price changes, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/PriceChange" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/history:
    get:
      tags: [Orders]
      summary: List an order's status-change audit trail
      description: Newest first. Each entry's `label` is a frozen snapshot of the status's label at the time of the change, not recomputed from the current vocabulary.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Status history entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/OrderStatusHistoryEntry" }
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/images:
    post:
      tags: [Orders]
      summary: Upload a reference image into one of the 4 slots
      description: Gated by `orders:edit:customer_product_fields` (same permission as editing the order's content fields). `multipart/form-data`, max 10MB, one of 4 slots.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [slot, file]
              properties:
                slot: { type: integer, minimum: 1, maximum: 4 }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Image stored, returns a fresh signed URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderImage" }
        "400":
          description: Invalid slot, missing file, or unsupported content type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/{id}/images/{slot}:
    delete:
      tags: [Orders]
      summary: Remove an image from a slot
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - name: slot
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 4 }
      responses:
        "204": { description: Removed }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{orderId}/payments:
    get:
      tags: [Payments]
      summary: List an order's payment ledger
      description: Gated by `payments:read` at the router level; a scoped (designer) caller additionally must be the order's designer, checked in the service.
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Ledger entries, most recent paid_at first
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Payments]
      summary: Record a payment
      description: |
        Gated by `payments:manage` (owner, accountant, the order's own
        designer). Refused with 409 `PAYMENT_ORDER_NOT_PRICED` while the order
        has no price (ADR 0008), with 400 `PAYMENT_DATE_INVALID` for a
        `paidAt` after the shop's today (it must be a real YYYY-MM-DD date),
        and with 400 `PAYMENT_EXCEEDS_TOTAL` if the resulting ledger sum would
        exceed `total_amount` (overpayment). Allowed before or after delivery.
        After recording, the order's DERIVED payment status is recomputed and
        synced (unpaid -> advance_paid -> fully_paid), and its `nextPaymentDate`
        is rescheduled: cleared once fully paid, or set to the request's
        `nextPaymentDate` while a balance remains.
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                type: object
                properties: { payment: { $ref: "#/components/schemas/Payment" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "PAYMENT_ORDER_NOT_PRICED -- set the order total first; PAYMENT_MONTH_CLOSED -- paidAt is in a month whose books are closed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{orderId}/payments/{paymentId}:
    patch:
      tags: [Payments]
      summary: Edit a payment entry
      description: |
        Gated by `payments:correct` -- owner and accountant only (ADR 0008).
        Refused with 409 `PAYMENT_LOCKED_AFTER_DELIVERY` once the order is
        delivered (also enforced by a database trigger). Same overpayment and
        payment-date rules as POST, evaluated against the edited values.
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
        - $ref: "#/components/parameters/PaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePaymentRequest" }
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                type: object
                properties: { payment: { $ref: "#/components/schemas/Payment" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "PAYMENT_LOCKED_AFTER_DELIVERY -- the order is delivered; PAYMENT_MONTH_CLOSED -- the payment's month, or the month it would move to, is closed"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      tags: [Payments]
      summary: Remove a payment entry
      description: Gated by `payments:correct` -- owner and accountant only. Refused with 409 `PAYMENT_LOCKED_AFTER_DELIVERY` once the order is delivered, or `PAYMENT_MONTH_CLOSED` when the payment is dated in a closed month (ADR 0008). Re-derives the order's payment status.
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "204": { description: Removed }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "PAYMENT_LOCKED_AFTER_DELIVERY -- the order is delivered; PAYMENT_MONTH_CLOSED -- the payment is dated in a closed month"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team-members:
    get:
      tags: [Team Members]
      summary: Lightweight designer/master-tailor lookup
      description: Backs the designer/master-tailor selects on the order form and the filter dropdowns on the orders list. Any authenticated role can read it (no capability gate beyond `requireAuth`). With `q` + `limit` it backs the designer type-ahead (Leads filter and assign) -- a handful of matches instead of the whole team.
      parameters:
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
        - name: q
          in: query
          description: Name contains (case-insensitive).
          schema: { type: string, maxLength: 80 }
        - name: limit
          in: query
          description: At most this many (1-20). Omitted = every active member, as before.
          schema: { type: integer, minimum: 1, maximum: 20 }
      responses:
        "200":
          description: Active team members, optionally filtered by role
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/TeamMember" }

  /reports/staff-activity:
    get:
      tags: [Reports]
      summary: Working / Idle staff -- searched, filtered and paged in the database
      description: |
        Owner/Manager only (`reports:staff`). The owner and accountant are never
        listed. A **designer** is `working` while they have *created* an
        undelivered order in the last `windows.designerDays` (45) days; a
        **master tailor, production manager or worker** while they made the
        *most recent* stage move on an undelivered order in the last
        `windows.floorDays` (30) days. `counts` (the summary tiles) cover the
        search + role filters but ignore `status`; `total` counts every filter.
        Ordered Working first, then role, then most orders in hand, then name.
        Also backs the Staff Report's person picker (`role=designer` /
        `master_tailor`). One query per page, whatever its size.
      parameters:
        - { name: q, in: query, required: false, description: "Name contains (case-insensitive; % and _ are literal). Max 100 chars.", schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [designer, master_tailor, production_manager, worker] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [working, idle] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One page of staff, plus totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffActivity" }
        "400":
          description: A limit over 50, an unknown role/status, or a search over 100 characters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/activity-days:
    get:
      tags: [Reports]
      summary: The 7 days the activity feed covers
      description: |
        Owner/Manager only. Today and the 6 days before it, newest first,
        computed in the shop's timezone (`BUSINESS_TIMEZONE`, default
        Asia/Kolkata). No data: the client loads each day on demand with
        `GET /reports/activity`.
      responses:
        "200":
          description: The day list
          content:
            application/json:
              schema:
                type: object
                required: [timeZone, today, days]
                properties:
                  timeZone: { type: string, example: Asia/Kolkata }
                  today: { type: string, format: date }
                  days: { type: array, items: { type: string, format: date }, minItems: 7, maxItems: 7 }
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/activity:
    get:
      tags: [Reports]
      summary: One day of activity in one category, with every category's count
      description: |
        Owner/Manager only. One CATEGORY of what happened on `day` (midnight to
        midnight in the shop's timezone), newest first, paged -- each category
        is its own log (ADR 0008, phase 3), so a busy day reads by kind:

        | category | log | kinds |
        |---|---|---|
        | `orders` | order_audit_log + order_price_history | order.created, order.updated (`details.changes`: field -> {from, to}), order.image_deleted, price.set / price.raise / price.discount |
        | `stages` | order_status_history (moves only) | stage.moved (`details.from`, `details.to`) |
        | `payments` | payment_audit_log | payment.created / payment.updated / payment.deleted (typed amount, method, paidAt, previous*) |
        | `leads` | lead_events | lead.created, lead.enquiry_merged, lead.assigned, lead.status_changed, lead.converted |
        | `accounts` | audit_log | auth.login, auth.logout, auth.password_changed, user.* |

        `counts` gives every category's count for the day (the tabs) and
        `total` the chosen one's. A day outside the last 7 is a 400. Each event
        carries the actor's name and role, plus the order's number, the lead's
        number, or the account's name.
      parameters:
        - { name: day, in: query, required: true, schema: { type: string, format: date } }
        - { name: category, in: query, required: false, schema: { type: string, enum: [orders, stages, payments, leads, accounts], default: orders } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: A page of that day's events in the category, plus every category's count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityDay" }
        "400":
          description: Not a real date, not one of the last 7 days, or an unknown category
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /ledger/summary:
    get:
      tags: [Ledger]
      summary: This month's four numbers
      description: |
        This calendar month (in the shop's timezone): total booked (orders
        booked this month, as priced now), paid so far on those orders (on any
        date), outstanding (total - paid so far) and cash collected (money
        received this month, from any order). Read from `ledger_daily`, which
        database triggers keep in step with every order and payment write.
      responses:
        "200":
          description: This month's figures
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerSummary" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /ledger/months:
    get:
      tags: [Ledger]
      summary: Calendar months of a range, newest first, paged -- with the range's totals
      description: |
        Every month in `[from, to]` (YYYY-MM, 2000-01 up to this month), newest
        first; a month with no activity reads as zeros. `total` is the number
        of months; `totals` sums the WHOLE range (not just the page). Two
        reads of `ledger_daily` per page. Defaults: this year so far.
      parameters:
        - { name: from, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2020-01" } }
        - { name: to, in: query, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-10" } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 60, default: 12 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One page of months and the range's totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerMonthsPage" }
        "400":
          description: "LEDGER_MONTHS_RANGE_INVALID -- not YYYY-MM, backwards, or outside 2000-01..this month; or a limit over 60"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /ledger/months/export:
    get:
      tags: [Ledger]
      summary: Every month of a range, unpaged -- the CSV / PDF export
      description: Same figures as GET /ledger/months, for every month of the range (at most 240 months), plus the range's totals and the shop's timezone.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { name: to, in: query, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        "200":
          description: The range's months and totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerMonthsExport" }
        "400":
          description: LEDGER_MONTHS_RANGE_INVALID -- as for /ledger/months, or over 240 months
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /ledger/months/{month}/closings:
    get:
      tags: [Ledger]
      summary: A month's books -- its figures now, and every close and reopen
      description: |
        The latest close's `figures` are the month's closing record; compare
        them with `figuresNow`. Total, paid so far and outstanding follow the
        month's orders and can change after closing; cash collected and the
        payment count can't (ADR 0008 phase 5).
      parameters:
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-09" } }
      responses:
        "200":
          description: The month's books
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerMonthClosings" }
        "400":
          description: LEDGER_MONTHS_RANGE_INVALID -- not YYYY-MM
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /ledger/months/{month}/close:
    post:
      tags: [Ledger]
      summary: Close a finished month's books
      description: |
        `ledger:close` -- Owner and Accountant. Stores the month's figures as
        they are now (the closing record). From then on no payment dated in the
        month can be added, edited or removed -- by the API (409
        `PAYMENT_MONTH_CLOSED`) or directly in the database. Takes the month's
        lock exclusively, so it waits for payment changes already in flight in
        the month and counts them.
      parameters:
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-09" } }
      responses:
        "201":
          description: Closed
          content:
            application/json:
              schema:
                type: object
                properties: { closing: { $ref: "#/components/schemas/LedgerClosing" } }
        "400":
          description: LEDGER_MONTHS_RANGE_INVALID -- not YYYY-MM
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "LEDGER_MONTH_NOT_FINISHED -- this month or later; LEDGER_MONTH_ALREADY_CLOSED"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ledger/months/{month}/reopen:
    post:
      tags: [Ledger]
      summary: Reopen a closed month, with a reason
      description: "`ledger:reopen` -- Owner only. The reason (3-500 characters) is kept with the reopen; the closing record stays."
      parameters:
        - { name: month, in: path, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$', example: "2026-09" } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3, maxLength: 500, example: "A cash payment was entered with the wrong date" }
      responses:
        "201":
          description: Reopened
          content:
            application/json:
              schema:
                type: object
                properties: { closing: { $ref: "#/components/schemas/LedgerClosing" } }
        "400":
          description: "LEDGER_REOPEN_REASON_REQUIRED; LEDGER_MONTHS_RANGE_INVALID -- not YYYY-MM"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: LEDGER_MONTH_NOT_CLOSED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /ledger/reconciliations/latest:
    get:
      tags: [Ledger]
      summary: The latest check of the register, and whether the nightly one is on schedule
      description: |
        The check recounts every day from the raw orders and payments and
        compares with the register, counts overpaid orders and wrong payment
        statuses, and confirms every closed month still holds the cash it was
        closed with. It runs every night at 02:00 IST (pg_cron) and on demand.
      responses:
        "200":
          description: The latest check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerVerification" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /ledger/reconciliations:
    post:
      tags: [Ledger]
      summary: Verify now -- run the check
      description: The same check the nightly job runs. It only reads, apart from its own result row. One check at a time.
      responses:
        "201":
          description: The check that just ran
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerVerification" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: LEDGER_CHECK_RUNNING -- another check is running; try again in a moment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /leads:
    get:
      tags: [Leads]
      summary: List leads (paged, searched, filtered)
      description: Owner sees every lead; a designer only their own (`leads:read`). Urgent first, then newest. Max 50 a page.
      parameters:
        - name: status
          in: query
          description: "`open` = every stage that isn't converted / lost / discarded."
          schema: { type: string, enum: [open, new, assigned, unattended, attended, follow_up, converted, lost, discarded] }
        - { name: urgent, in: query, schema: { type: string, enum: ["true", "false"] } }
        - { name: q, in: query, description: "Search customer name, phone or lead number.", schema: { type: string, maxLength: 80 } }
        - { name: assignedTo, in: query, description: Owner only -- one designer's leads., schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One page of leads
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads: { type: array, items: { $ref: "#/components/schemas/Lead" } }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Leads]
      summary: Add a lead by hand (owner)
      description: "`leads:manage`. A walk-in, phone call, Instagram message... Optionally assigned to an active designer at once."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerName, phone, requirement, source]
              additionalProperties: false
              properties:
                customerName: { type: string, maxLength: 80, description: "Letters (any script), spaces, . ' -" }
                phone: { type: string, description: A 10-digit Indian mobile in any common format; stored as 10 digits. }
                requirement: { type: string, maxLength: 1000 }
                source: { type: string, enum: [walk_in, phone_call, instagram, whatsapp, referral, other] }
                assignTo: { type: string, format: uuid, nullable: true }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { type: object, properties: { lead: { $ref: "#/components/schemas/Lead" } } }
        "400":
          description: VALIDATION_ERROR, or LEAD_ASSIGNEE_INVALID (not an active designer)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /leads/summary:
    get:
      tags: [Leads]
      summary: Counts per stage and urgent (the dashboard tiles)
      responses:
        "200":
          description: The Leads dashboard tiles
          content:
            application/json:
              schema:
                type: object
                properties:
                  byStatus: { type: object, additionalProperties: { type: integer } }
                  urgent: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /leads/designers:
    get:
      tags: [Leads]
      summary: The owner's Designers table -- searched and paged
      description: "`leads:manage`. Designers who have leads, busiest first (open, then waiting), with their counts. Name search (contains) and a page -- never the whole team at once. Total comes from a window count (one query)."
      parameters:
        - { name: q, in: query, description: Designer name contains., schema: { type: string, maxLength: 80 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 10 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One page
          content:
            application/json:
              schema:
                type: object
                properties:
                  designers:
                    type: array
                    items:
                      type: object
                      properties:
                        designerId: { type: string, format: uuid }
                        designerName: { type: string }
                        open: { type: integer }
                        waiting: { type: integer, description: Assigned but not yet received. }
                        converted: { type: integer }
                        lost: { type: integer }
                  total: { type: integer }
                  limit: { type: integer }
                  offset: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /leads/badge:
    get:
      tags: [Leads]
      summary: The red badge count
      description: "Owner: unassigned New leads. Designer: their leads waiting for Received, plus their open urgent ones. `Cache-Control: no-store`. The web refreshes it on open, reopen and reload, and every 10 minutes."
      responses:
        "200":
          description: Count
          content:
            application/json:
              schema: { type: object, properties: { count: { type: integer } } }
        "403": { $ref: "#/components/responses/Forbidden" }

  /leads/{id}:
    get:
      tags: [Leads]
      summary: One lead with comments, history and the caller's allowed actions
      description: A designer asking for someone else's lead gets 404 (existence never leaks).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: The lead
          content:
            application/json:
              schema:
                type: object
                properties:
                  lead: { $ref: "#/components/schemas/Lead" }
                  comments: { type: array, items: { $ref: "#/components/schemas/LeadComment" } }
                  events: { type: array, items: { $ref: "#/components/schemas/LeadEvent" } }
                  samePhone: { type: array, description: Owner only -- other leads from this phone., items: { type: object } }
                  actions:
                    type: object
                    properties:
                      nextStatuses: { type: array, items: { type: string } }
                      canAssign: { type: boolean }
                      canConvert: { type: boolean }
                      canComment: { type: boolean }
        "404": { $ref: "#/components/responses/NotFound" }

  /leads/{id}/assign:
    patch:
      tags: [Leads]
      summary: Assign or reassign to a designer (owner)
      description: Sets the stage to Assigned (the designer must tap Received). Closed leads can't be assigned (409 LEAD_CLOSED). `version` is the optimistic lock (409 LEAD_MODIFIED).
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [designerId]
              additionalProperties: false
              properties:
                designerId: { type: string, format: uuid }
                version: { type: integer }
      responses:
        "200":
          description: Assigned
          content:
            application/json:
              schema: { type: object, properties: { lead: { $ref: "#/components/schemas/Lead" } } }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: LEAD_CLOSED or LEAD_MODIFIED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /leads/{id}/status:
    patch:
      tags: [Leads]
      summary: Move a lead to another stage
      description: |
        Rules in leads/domain/lead-status.rules.ts. Designer (own leads):
        assigned -> unattended (Received); unattended -> attended / follow_up / lost;
        attended -> follow_up / lost; follow_up -> attended / follow_up / lost.
        Owner: new -> discarded; any working stage; lost -> unattended (reopen);
        discarded -> new (restore). Never `assigned` (use assign) or
        `converted` (save an order with leadId). `lost` needs `lostReason`;
        `followUpOn` can't be in the past. Contacting the customer clears urgent.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              additionalProperties: false
              properties:
                status: { type: string, enum: [new, unattended, attended, follow_up, lost, discarded] }
                followUpOn: { type: string, format: date, nullable: true }
                lostReason: { type: string, maxLength: 300, nullable: true }
                version: { type: integer }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema: { type: object, properties: { lead: { $ref: "#/components/schemas/Lead" } } }
        "400":
          description: VALIDATION_ERROR, or LEAD_STATUS_FORBIDDEN (assigned / converted)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: LEAD_STATUS_FORBIDDEN -- not a move this role can make
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }

  /leads/{id}/comments:
    post:
      tags: [Leads]
      summary: Add a comment (append-only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema: { type: object, properties: { comment: { $ref: "#/components/schemas/LeadComment" } } }
        "404": { $ref: "#/components/responses/NotFound" }

  /public/enquiry-form:
    get:
      tags: [Public]
      summary: What the open enquiry form needs before showing
      description: No login. A signed open-time token (submissions under 3 s, or with a token over 2 h old, aren't stored) and, only while Turnstile is switched on, its site key. `Cache-Control no-store`. 120 per IP per hour.
      security: []
      responses:
        "200":
          description: Form config
          content:
            application/json:
              schema:
                type: object
                properties:
                  formToken: { type: string }
                  turnstileSiteKey: { type: string, nullable: true }

  /public/enquiries:
    post:
      tags: [Public]
      summary: A customer's enquiry (the only unauthenticated write)
      description: |
        No login. 5 per IP per hour, 200 per hour overall (429 RATE_LIMITED);
        8 kB body limit (413 PAYLOAD_TOO_LARGE); malformed JSON is 400
        MALFORMED_REQUEST. Strict schema. Honeypot `website` filled, or a
        too-fast submit: the same "received" reply, nothing stored. Per phone,
        the 1st enquiry creates a New lead; the 2nd within 24 h of the first
        merges into it and marks it urgent; the 3rd and later get
        `already_received` and nothing is stored. The reply never contains
        data or ids.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, requirement, formToken]
              additionalProperties: false
              properties:
                name: { type: string, description: "Letters (any script), spaces, . ' - ; 2-80 chars" }
                phone: { type: string, description: A 10-digit Indian mobile in any common format }
                requirement: { type: string, maxLength: 1000 }
                formToken: { type: string, maxLength: 128 }
                website: { type: string, description: Honeypot -- people leave it empty }
                turnstileToken: { type: string, description: Required only while Turnstile is switched on }
      responses:
        "201":
          description: Received
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryReply" }
        "200":
          description: Already received (3rd or later enquiry from this phone within 24 h)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryReply" }
        "400":
          description: VALIDATION_ERROR, MALFORMED_REQUEST, ENQUIRY_FORM_EXPIRED (reload) or ENQUIRY_VERIFICATION_FAILED (Turnstile)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: PAYLOAD_TOO_LARGE
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued access token, obtained from `POST /auth/login` (or `/refresh`, `/exchange-code`). Verified independently on every request -- see `common/middleware/auth.middleware.ts`.

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but the caller's role/scope doesn't allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (or outside the caller's row scope)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Lead:
      type: object
      properties:
        id: { type: string, format: uuid }
        leadNumber: { type: string, example: LEAD-2026-031 }
        customerName: { type: string }
        phone: { type: string, example: "9876543210" }
        requirement: { type: string }
        source: { type: string, enum: [public_form, walk_in, phone_call, instagram, whatsapp, referral, other] }
        status: { type: string, enum: [new, assigned, unattended, attended, follow_up, converted, lost, discarded] }
        assignedTo: { type: string, format: uuid, nullable: true }
        assignedToName: { type: string, nullable: true }
        assignedAt: { type: string, format: date-time, nullable: true }
        urgent: { type: boolean, description: A repeat enquiry not yet contacted. }
        enquiryCount: { type: integer }
        firstEnquiryAt: { type: string, format: date-time }
        lastEnquiryAt: { type: string, format: date-time }
        followUpOn: { type: string, format: date, nullable: true }
        lostReason: { type: string, nullable: true }
        convertedOrderId: { type: string, format: uuid, nullable: true }
        convertedOrderNumber: { type: string, nullable: true }
        createdBy: { type: string, format: uuid, nullable: true, description: Null means the public enquiry form. }
        createdByName: { type: string, nullable: true }
        version: { type: integer }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    LeadComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        authorId: { type: string, format: uuid, nullable: true }
        authorName: { type: string, nullable: true }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    LeadEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [created, enquiry_merged, assigned, status_changed, converted] }
        actorName: { type: string, nullable: true, description: Null means the public enquiry form. }
        fromStatus: { type: string, nullable: true }
        toStatus: { type: string, nullable: true }
        assignedToName: { type: string, nullable: true }
        note: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    EnquiryReply:
      type: object
      properties:
        result: { type: string, enum: [received, already_received] }
        message: { type: string }
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "1500.00"
      description: >
        A monetary amount. Money crosses every boundary as a STRING with
        exactly two decimals ("1500.00"), never a JSON number -- JSON numbers
        are IEEE-754 floats and can drift, a string is exact. The server uses
        decimal.js (see src/common/money/money.ts); clients should treat these
        as opaque decimal strings and never parse them into floats for
        arithmetic. Currency is INR.
    MoneyInput:
      oneOf:
        - type: string
          pattern: '^\d+(\.\d{1,2})?$'
        - type: number
          minimum: 0
      example: "1500.00"
      description: >
        Money coming IN over the wire. Prefer a decimal string ("1500.00"); a
        JSON number is also accepted for convenience. The server validates and
        normalises it to a canonical 2-decimal string (see
        src/common/money/money-schema.ts).
    Error:
      type: object
      description: >
        The one shape every error response takes, produced by
        common/middleware/error.middleware.ts regardless of which layer threw.
        `code` is a stable application error code from the ERROR_CODES registry
        (common/errors/error-codes.ts) -- clients should branch on `code`, not
        on `error` (the human message, which may change). `requestId` correlates
        the response with the server logs. Auth endpoints additionally return
        `429` with code `RATE_LIMITED` when the brute-force limit is exceeded.
      properties:
        error: { type: string }
        code: { type: string, example: ORDER_NOT_FOUND }
        details: {}
        requestId: { type: string, description: Correlates this response with the server logs. }

    Role:
      type: string
      enum: [owner_manager, designer, master_tailor, accountant, production_manager, worker]

    GranularStatus:
      type: string
      description: >
        The 16-stage production flow. `orders.production_status` always
        stores one of these. Moving into a stage is gated by role tier
        (design / pm_received / production / finalization) -- not by
        assignment -- moves forward only (except Ready -> Alteration),
        reaches Delivered only from Ready, and can't skip past a stage the
        role couldn't set (see PATCH /orders/{id}/status).
      enum:
        - design_pending
        - design_approved
        - production_manager_received
        - falls_kutchu
        - fabric_purchased
        - dyeing
        - marking
        - cutting
        - stitching
        - hand_work
        - machine_work
        - finishing
        - quality_check
        - alteration
        - ready
        - delivered

    ProductCategory:
      type: string
      description: >
        The product catalogue -- 47 stored values in 6 collections (Upper Body,
        Full Body, Lower Body, Mens Wear, Kids Wear - Girls, Kids Wear - Boys);
        labels and collections live in `src/domain/product-categories.ts`. This
        is a stored VALUE, never a display label ("saree", not "Saree"). Mens
        Wear and Kids Wear values carry a `mens_` / `kids_` prefix, which is how
        the labels that appear twice stay distinct (`shirt` vs `mens_shirt`,
        `pant` vs `mens_pant`, `skirt` vs `mens_skirt`). Validated by the API only -- the database has no
        CHECK on this column since migration 20260924000002.
      enum:
        # Upper Body
        - saree_blouse
        - work_blouse
        - crop_top_blouse
        - corset
        - shirt
        - designer_blouse
        - hw_blouse_skirt
        - short_kurta
        - pakistani_kurta
        - custom_upper_body
        # Full Body
        - anarkali
        - gown
        - jumpsuit
        - bodycon
        - drape_gown
        - bridal_lehenga
        - saree
        - custom_ethnic_wear
        - boutique_fashion
        # Lower Body
        - skirt
        - half_saree
        - divided_skirt
        - palazzo
        - pant
        - sharara
        - pakistani_pant
        - drape_skirt
        - mermaid_skirt
        - petticoat
        - custom_lower_body
        # Mens Wear
        - mens_shirt
        - mens_pant
        - mens_skirt
        - mens_shalwar
        - mens_blazer
        - mens_waist_coat
        - mens_bandi
        - mens_three_piece_set
        - mens_dhoti
        - mens_kurta
        - mens_prince_coat
        - mens_panchay
        - mens_shalya
        - mens_indo_western
        - mens_custom
        # Kids Wear
        - kids_girls_custom
        - kids_boys_custom

    ChangePriceRequest:
      type: object
      required: [totalAmount]
      properties:
        totalAmount:
          allOf: [{ $ref: "#/components/schemas/MoneyInput" }]
          description: The new total (at most 9999999999.99).
        reason:
          type: string
          maxLength: 500
          description: Required (3-500 characters) to raise or discount; optional for the first price.

    PriceChange:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        kind: { type: string, enum: [set, raise, discount] }
        previousTotal:
          type: string
          allOf: [{ $ref: "#/components/schemas/Money" }]
          nullable: true
          description: Null for the first price.
        newTotal: { $ref: "#/components/schemas/Money" }
        collected:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: What had been collected when the price changed.
        reason: { type: string, nullable: true }
        changedBy: { type: string, format: uuid, nullable: true }
        changedByName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    PaymentStatus:
      type: string
      description: DERIVED from the ledger (sum of payments vs order total), never submitted. not_priced (no total yet, ADR 0008) -> unpaid -> advance_paid -> fully_paid. A 0 total (free work) is fully_paid.
      enum: [not_priced, unpaid, advance_paid, fully_paid]

    PaymentMethod:
      type: string
      enum: [cash, card, upi, bank_transfer, cheque, other]

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    AuthSession:
      type: object
      description: Returned by login/refresh/exchange-code. Tokens only ever appear in this response body -- the API never sets a cookie itself.
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: integer, description: Unix seconds }
        profile: { $ref: "#/components/schemas/Profile" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true, description: "Gates whether generate-password stays available for owner_manager/accountant accounts." }
        hasQrLogin: { type: boolean, description: "Whether a QR login token exists. Never the token/hash itself." }

    TeamMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Always > 0 -- a correction is a payment update/delete, not a negative entry.
        method: { $ref: "#/components/schemas/PaymentMethod" }
        paidAt: { type: string, format: date }
        recordedBy: { type: string, format: uuid, nullable: true }
        recordedByName: { type: string }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        monthClosed: { type: boolean, description: "Dated in a month whose books are closed -- it can't be edited or removed (ADR 0008 phase 5)." }

    CreatePaymentRequest:
      type: object
      required: [amount, method]
      properties:
        amount: { $ref: "#/components/schemas/MoneyInput" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        paidAt: { type: string, format: date, description: Defaults to today if omitted. }
        notes: { type: string }
        nextPaymentDate:
          type: string
          format: date
          nullable: true
          description: "When the next payment is expected if a balance remains (reschedules the order's due tracking). Null clears it; ignored once fully paid (always cleared)."

    UpdatePaymentRequest:
      type: object
      description: Every field from CreatePaymentRequest, but optional (partial update).
      properties:
        amount: { $ref: "#/components/schemas/MoneyInput" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        paidAt: { type: string, format: date }
        notes: { type: string }

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/GranularStatus" }

    OrderStatusHistoryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/GranularStatus" }
        label: { type: string, description: Snapshot of the status's label at the time of the change. }
        changedBy: { type: string, format: uuid, nullable: true }
        changedByName: { type: string }
        createdAt: { type: string, format: date-time }

    OrderImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        slot: { type: integer, minimum: 1, maximum: 4 }
        storagePath: { type: string }
        url: { type: string, description: "Freshly-signed Supabase Storage URL, re-resolved on every read -- never stored." }
        originalFilename: { type: string, nullable: true }
        contentType: { type: string, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        uploadedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    OrderListItem:
      description: |
        A row of `GET /orders`: every `Order` field **except `images`**. No
        list screen shows photos, and each photo would need a signed URL from
        storage, so lists skip them entirely (no image query, no storage call).
        `GET /orders/{id}` returns the full order with signed image URLs.
      allOf:
        - { $ref: "#/components/schemas/Order" }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, example: ORD-2026-014 }
        customerName: { type: string }
        phone: { type: string }
        billNumber: { type: string }
        bookingDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        designerId: { type: string, format: uuid }
        designerName: { type: string }
        masterTailorId: { type: string, format: uuid }
        masterTailorName: { type: string }
        productCategory: { $ref: "#/components/schemas/ProductCategory" }
        orderDetails: { type: string }
        handWork: { type: boolean }
        machineWork: { type: boolean }
        purchaseRequired: { type: boolean }
        paymentStatus:
          allOf: [{ $ref: "#/components/schemas/PaymentStatus" }]
          description: Derived from the ledger (never submitted). Absent entirely (not null) for callers without payments:read (master_tailor) -- a real server-side omission, not a UI-only hide.
        totalAmount:
          type: string
          allOf: [{ $ref: "#/components/schemas/Money" }]
          nullable: true
          description: "Null while the order has no price (ADR 0008). Absent for roles without payments:read -- see paymentStatus."
        priceSet:
          type: boolean
          description: "Whether the order has a price. Present for EVERY role (it's not an amount), so any role can tell Delivered needs pricing first."
        amountPaid:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "Absent for master_tailor. The real sum of GET /orders/{orderId}/payments -- never stored, always derived at read time."
        outstanding:
          type: string
          allOf: [{ $ref: "#/components/schemas/Money" }]
          nullable: true
          description: "Null while the order has no price. Absent for roles without payments:read -- see paymentStatus."
        nextPaymentDate:
          type: string
          format: date
          nullable: true
          description: "When the next payment is expected (payment-due tracking). Null when unset or fully paid. Visible to all roles."
        productionStatus: { $ref: "#/components/schemas/GranularStatus" }
        designerInstructions: { type: string, nullable: true }
        specialNotes: { type: string, nullable: true }
        images:
          type: array
          items: { $ref: "#/components/schemas/OrderImage" }
        version: { type: integer, description: "Optimistic-lock version. Echo it back in PATCH /orders/:id to be told (409 ORDER_MODIFIED) if someone else edited the order first." }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderStats:
      type: object
      properties:
        total: { type: integer, description: Every order in the caller's row scope. }
        active: { type: integer, description: "Not yet Delivered (Ready orders count as active)." }
        completed: { type: integer, description: "Deprecated (kept for older web builds): every Delivered order ever. The dashboard shows deliveredThisMonth." }
        deliveredThisMonth: { type: integer, description: "Orders that reached Delivered since the 1st of this month, shop timezone (by their stage-history row). Visible to all roles." }
        ready: { type: integer, description: "Orders currently in Ready -- finished, waiting for the customer. Visible to all roles." }
        thisMonth: { type: integer, description: "Orders created since the 1st of this month, shop timezone. Visible to all roles." }
        inProduction: { type: integer, description: "Orders in an active production stage (Falls/Kutchu..Alteration; not Ready or Delivered). Visible to all roles." }
        overdue: { type: integer, description: "Active orders past their delivery due date. Visible to all roles." }
        urgent: { type: integer, description: "Active orders due within 3 days (not overdue). Visible to all roles." }
        pendingPayments: { type: integer, description: "Absent for master_tailor. Orders still owing (unpaid / advance_paid) -- a not-priced order owes nothing yet." }
        notPriced: { type: integer, description: "Absent for master_tailor. Orders with no price yet (the Price not set card / bucket not_priced)." }
        collectedRevenue:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "Absent for master_tailor. SUM(payments.amount) across the scope."
        outstandingRevenue:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "Absent for master_tailor. SUM(orders.total_amount) - collectedRevenue, floored at 0."

    LedgerFigures:
      type: object
      description: "A period's figures, summed from ledger_daily. Money as 2dp strings."
      properties:
        ordersBooked: { type: integer }
        ordersNotPriced: { type: integer, description: "Booked orders without a price yet (not in total)." }
        total: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Value of the orders booked in the period, as priced now." }
        paidSoFar: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Paid so far, on any date, on those orders." }
        outstanding: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "total - paidSoFar." }
        cashCollected: { allOf: [{ $ref: "#/components/schemas/Money" }], description: "Money received in the period, from any order." }
        paymentsCount: { type: integer }

    LedgerMonth:
      allOf:
        - { $ref: "#/components/schemas/LedgerFigures" }
        - type: object
          properties:
            month: { type: string, example: "2026-10", description: "YYYY-MM -- always a calendar month." }
            books: { $ref: "#/components/schemas/LedgerMonthBooks" }

    LedgerMonthBooks:
      type: object
      description: "A month's books (ADR 0008 phase 5): closed when its latest close/reopen was a close."
      properties:
        status: { type: string, enum: [open, closed], description: "closed: no payment dated in the month can be added, edited or removed." }
        ended: { type: boolean, description: "The month has ended, so it can be closed (this month never has)." }
        closedAt: { type: string, format: date-time, nullable: true }
        closedByName: { type: string, nullable: true }

    LedgerClosing:
      type: object
      description: One close or reopen of a month.
      properties:
        id: { type: string, format: uuid }
        month: { type: string, example: "2026-09" }
        action: { type: string, enum: [closed, reopened] }
        figures:
          type: object
          allOf: [{ $ref: "#/components/schemas/LedgerFigures" }]
          nullable: true
          description: "The month's figures at closing -- the closing record (closed only)."
        reason: { type: string, nullable: true, description: "Why it was reopened (reopened only)." }
        actorName: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    LedgerMonthClosings:
      type: object
      properties:
        month: { type: string, example: "2026-09" }
        books: { $ref: "#/components/schemas/LedgerMonthBooks" }
        figuresNow: { $ref: "#/components/schemas/LedgerFigures" }
        history: { type: array, items: { $ref: "#/components/schemas/LedgerClosing" }, description: "Closes and reopens, newest first (at most 50)." }
        total: { type: integer, description: "How many closes and reopens there are in all." }

    LedgerReconciliation:
      type: object
      description: "One run of the check: the register against a recount of every order and payment, plus money rules."
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [nightly, manual] }
        requestedByName: { type: string, nullable: true }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }
        durationMs: { type: integer }
        status: { type: string, enum: [verified, problems] }
        daysChecked: { type: integer }
        mismatchedDays: { type: integer }
        mismatches:
          type: array
          description: Up to 50 mismatched days, newest first.
          items:
            type: object
            properties:
              day: { type: string, format: date }
              fields:
                type: array
                items:
                  type: object
                  properties:
                    field: { type: string, enum: [ordersBooked, ordersPriced, total, paidSoFar, cashCollected, paymentsCount] }
                    register: { type: string }
                    actual: { type: string }
        overpaidOrders: { type: integer, description: "Orders paid more than their total (the database refuses this; expected 0)." }
        statusMismatches: { type: integer, description: "Orders whose payment status doesn't match their payments." }
        closedMonthDrift: { type: integer, description: "Closed months whose cash no longer matches their closing record." }
        closedMonths:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              closedCash: { $ref: "#/components/schemas/Money" }
              cashNow: { $ref: "#/components/schemas/Money" }
              closedPayments: { type: integer }
              paymentsNow: { type: integer }

    LedgerVerification:
      type: object
      properties:
        timeZone: { type: string, example: Asia/Kolkata }
        latest:
          type: object
          allOf: [{ $ref: "#/components/schemas/LedgerReconciliation" }]
          nullable: true
          description: The most recent check of any kind; null before the first.
        lastNightlyAt: { type: string, format: date-time, nullable: true }
        nightlyOverdue: { type: boolean, description: "Over 26 hours since the last nightly check -- the schedule has stopped." }

    LedgerSummary:
      type: object
      properties:
        month: { type: string, example: "2026-10" }
        asOf: { type: string, format: date, description: "The shop's today." }
        timeZone: { type: string, example: Asia/Kolkata }
        figures: { $ref: "#/components/schemas/LedgerFigures" }

    LedgerMonthsPage:
      type: object
      properties:
        from: { type: string, example: "2020-01" }
        to: { type: string, example: "2026-10" }
        months: { type: array, items: { $ref: "#/components/schemas/LedgerMonth" } }
        total: { type: integer, description: Months in the range. }
        limit: { type: integer }
        offset: { type: integer }
        totals: { $ref: "#/components/schemas/LedgerFigures" }

    LedgerMonthsExport:
      type: object
      properties:
        from: { type: string }
        to: { type: string }
        timeZone: { type: string }
        months: { type: array, items: { $ref: "#/components/schemas/LedgerMonth" } }
        totals: { $ref: "#/components/schemas/LedgerFigures" }

    StaffReport:
      type: object
      description: One designer/master-tailor's workload report from GET /orders/staff-report (reports:staff).
      properties:
        staff:
          type: object
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            role: { type: string, enum: [designer, master_tailor] }
        summary:
          type: object
          description: The current status of the orders they BOOKED in the selected month (the month's cohort).
          properties:
            booked: { type: integer, description: Orders they booked in the month (cohort size). }
            active: { type: integer }
            inProduction: { type: integer }
            completed: { type: integer, description: Orders currently in a completed stage (ready/delivered). }
            overdue: { type: integer }
            urgent: { type: integer }
            paymentPendingCount: { type: integer }
            paymentPendingAmount:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              description: Sum of outstanding across their not-fully-paid orders.
        weekly:
          type: array
          description: The selected month's weeks, oldest first, zero-filled and continuous.
          items:
            type: object
            properties:
              weekStart: { type: string, format: date, description: Monday of the week. }
              booked: { type: integer, description: Orders whose booking date falls in that week. }
              completed: { type: integer, description: Orders that reached a completed stage that week. }
        month: { type: string, description: "The month (YYYY-MM) the weekly breakdown covers (echoes the request; default current month)." }

    LedgerAmountSnapshot:
      type: object
      description: A payment's amount, method and date at a point in time.
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        method: { type: string, description: "cash | card | upi | bank_transfer | cheque | other" }
        paidAt: { type: string, format: date, description: "The payment's date (payment_audit_log keeps it typed, ADR 0008)." }

    LedgerEvent:
      type: object
      description: One payment-ledger event (a payment_audit_log row, written in the same transaction as the payment change), decoded for display.
      properties:
        id: { type: string, format: uuid, description: The payment_audit_log row id. }
        action: { type: string, enum: [created, updated, deleted], description: "created = recorded, updated = edited, deleted = removed." }
        at: { type: string, format: date-time, description: When the action happened (UTC). }
        actorName: { type: string, nullable: true, description: Who did it (null if that account was since removed). }
        orderId: { type: string, format: uuid, nullable: true }
        orderNumber: { type: string, nullable: true, description: Human-readable order number (null if the order was since removed). }
        snapshot:
          type: object
          allOf: [{ $ref: "#/components/schemas/LedgerAmountSnapshot" }]
          nullable: true
          description: created/deleted only -- the payment's amount + method.
        before:
          type: object
          allOf: [{ $ref: "#/components/schemas/LedgerAmountSnapshot" }]
          nullable: true
          description: updated only -- values before the edit.
        after:
          type: object
          allOf: [{ $ref: "#/components/schemas/LedgerAmountSnapshot" }]
          nullable: true
          description: updated only -- values after the edit.

    LedgerEventsResult:
      type: object
      description: Paginated payment-ledger activity feed from GET /orders/ledger-events (reports:financial).
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/LedgerEvent" }
        total: { type: integer, description: "Total events matching the range, ignoring pagination." }
        limit: { type: integer }
        offset: { type: integer }
        from: { type: string, format: date, description: Inclusive window start (echoes the resolved request). }
        to: { type: string, format: date, description: Inclusive window end. }

    LedgerExportResult:
      description: The whole week/month from GET /orders/ledger-events/export, plus the shop timezone its times are shown in.
      allOf:
        - $ref: "#/components/schemas/LedgerEventsResult"
        - type: object
          required: [timeZone]
          properties:
            timeZone: { type: string, example: Asia/Kolkata, description: "IANA zone of the shop (BUSINESS_TIMEZONE)." }

    CreateOrderRequest:
      type: object
      required:
        - customerName
        - phone
        - billNumber
        - dueDate
        - designerId
        - masterTailorId
        - productCategory
        - orderDetails
        - productionStatus
      properties:
        customerName: { type: string }
        phone: { type: string, pattern: "^\\d{10}$" }
        billNumber: { type: string }
        bookingDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        designerId: { type: string, format: uuid }
        masterTailorId: { type: string, format: uuid }
        productCategory: { $ref: "#/components/schemas/ProductCategory" }
        orderDetails: { type: string }
        handWork: { type: boolean, default: false }
        machineWork: { type: boolean, default: false }
        purchaseRequired: { type: boolean, default: false }
        # paymentStatus is NOT accepted -- it is derived from the ledger.
        totalAmount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          nullable: true
          default: null
          description: >-
            A decimal string like MoneyInput (a number is also accepted), or null.
            Usually omitted: a new order has no price and is priced afterwards
            with PUT /orders/{id}/price (ADR 0008). A total given here is the
            first price -- 403 ORDER_PRICE_FORBIDDEN unless the caller is the
            owner, the accountant, or the order's own designer.
        nextPaymentDate: { type: string, format: date, nullable: true, description: "When the next payment is expected (payment-due tracking). Optional; null to leave unset." }
        productionStatus: { $ref: "#/components/schemas/GranularStatus" }
        designerInstructions: { type: string }
        specialNotes: { type: string }
        confirmedWithProductionManager:
          type: boolean
          description: >-
            Not stored on the order. The creator's acknowledgement that the due
            date's day is full and the Production Manager agreed to take it
            anyway -- required to book a full day (else 409 DELIVERY_DAY_FULL),
            and audited as order.delivery_override when used.
        leadId:
          type: string
          format: uuid
          description: >-
            Not stored on the order. "This order is for that lead": the lead is
            marked Converted in the same transaction. If it can't be converted
            (not the caller's, not yet received, already closed) nothing is
            created -- 409 LEAD_NOT_CONVERTIBLE.

    UpdateOrderRequest:
      type: object
      description: |
        Every field from CreateOrderRequest, but optional (partial update) --
        deliberately a single role-agnostic schema rather than one per role.
        Which fields a given caller is actually allowed to touch is enforced
        by the service layer's RBAC field-splitting (see PATCH /orders/{id}),
        not by this schema. `productionStatus` is accepted here but the
        controller strips it before the service ever sees it.
      properties:
        customerName: { type: string }
        phone: { type: string, pattern: "^\\d{10}$" }
        billNumber: { type: string }
        bookingDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        designerId: { type: string, format: uuid }
        masterTailorId: { type: string, format: uuid }
        productCategory: { $ref: "#/components/schemas/ProductCategory" }
        orderDetails: { type: string }
        handWork: { type: boolean }
        machineWork: { type: boolean }
        purchaseRequired: { type: boolean }
        # paymentStatus is NOT accepted -- derived from the ledger.
        totalAmount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
          nullable: true
          description: "A decimal string (a number is also accepted) or null. Accepted only UNCHANGED (ignored); a different value is 400 ORDER_PRICE_USE_PRICING -- use PUT /orders/{id}/price."
        nextPaymentDate: { type: string, format: date, nullable: true, description: "When the next payment is expected (payment-due tracking). Null to clear." }
        productionStatus: { $ref: "#/components/schemas/GranularStatus" }
        designerInstructions: { type: string }
        specialNotes: { type: string }
        version: { type: integer, minimum: 0, description: "Optimistic-lock token: the `version` the order was loaded with. If it no longer matches (someone else edited first), the update is rejected with 409 ORDER_MODIFIED. Optional; omit to update unconditionally." }
        confirmedWithProductionManager:
          type: boolean
          description: "Same as on CreateOrderRequest: required to MOVE the order onto a full delivery day; audited when used. Not stored."

    StaffActivity:
      type: object
      required: [windows, counts, staff, total, limit, offset]
      properties:
        counts:
          type: object
          required: [working, idle]
          description: Working / Idle across the search + role filters (ignores status).
          properties:
            working: { type: integer }
            idle: { type: integer }
        total: { type: integer, description: Rows matching every filter. }
        limit: { type: integer }
        offset: { type: integer }
        windows:
          type: object
          required: [designerDays, floorDays]
          properties:
            designerDays: { type: integer, example: 45 }
            floorDays: { type: integer, example: 30 }
        staff:
          type: array
          items:
            type: object
            required: [id, fullName, role, status, openOrders, lastWorkAt, lastSeenAt]
            properties:
              id: { type: string, format: uuid }
              fullName: { type: string }
              role: { type: string, enum: [designer, master_tailor, production_manager, worker] }
              status: { type: string, enum: [working, idle] }
              openOrders: { type: integer, minimum: 0 }
              lastWorkAt: { type: string, format: date-time, nullable: true, description: "Latest qualifying event (order created / stage move)." }
              lastSeenAt: { type: string, format: date-time, nullable: true, description: "Latest audited action of any kind." }
    ActivityDay:
      type: object
      required: [day, timeZone, category, counts, events, total, limit, offset]
      properties:
        day: { type: string, format: date }
        timeZone: { type: string, example: Asia/Kolkata }
        category: { type: string, enum: [orders, stages, payments, leads, accounts] }
        counts:
          type: object
          description: Events per category on this day (the tabs).
          properties:
            orders: { type: integer }
            stages: { type: integer }
            payments: { type: integer }
            leads: { type: integer }
            accounts: { type: integer }
        total: { type: integer, description: "Events in the chosen category on this day (= counts[category])." }
        limit: { type: integer }
        offset: { type: integer }
        events:
          type: array
          items:
            type: object
            required: [id, category, kind, at]
            properties:
              id: { type: string, format: uuid }
              category: { type: string, enum: [orders, stages, payments, leads, accounts] }
              kind: { type: string, example: stage.moved, description: "What happened -- see the table on GET /reports/activity." }
              at: { type: string, format: date-time }
              actorName: { type: string, nullable: true, description: "Null for the public enquiry form, or an account since removed." }
              actorRole: { type: string, nullable: true }
              orderId: { type: string, format: uuid, nullable: true }
              orderNumber: { type: string, nullable: true }
              leadId: { type: string, format: uuid, nullable: true }
              leadNumber: { type: string, nullable: true }
              targetName: { type: string, nullable: true, description: "For account events: the account acted on." }
              details:
                type: object
                nullable: true
                additionalProperties: true
                description: "The category's facts: an edit's changes, a price's previousTotal / newTotal / reason, a stage's from / to, a payment's typed values, a lead's from / to / assignedTo / note."
    DeliveryLoad:
      type: object
      required: [capacity, nearCapacity, days]
      properties:
        capacity: { type: integer, example: 10, description: "DELIVERY_DAY_CAPACITY -- a day at or above this is full." }
        nearCapacity: { type: integer, example: 8, description: "80% of capacity, rounded up -- a day at or above this is filling up." }
        days:
          type: array
          description: Only days with at least one order, ascending. A missing day means 0.
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer, minimum: 1 }
