openapi: 3.0.3
info:
  title: Needle Eye API
  version: 0.1.0
  description: |
    Express + TypeScript backend for the Needle Eye boutique/tailoring ERP.
    Stateless REST: every request carries its own bearer token, verified
    independently -- nothing about a client's session is stored server-side
    between requests. `needleye-web` never talks to Supabase directly; every
    auth operation goes through the `/auth/*` endpoints documented here.

    See the repo README for the layered architecture (Controller ->
    Validation -> Service -> Repository -> Mapper) and the Mermaid flow-map
    diagrams -- this document covers the *what* (request/response contracts),
    the README's Flow Map section covers the *how* (which function calls
    which).
  contact:
    name: Needle Eye API
servers:
  - url: http://localhost:4000/api/v1
    description: Local dev
tags:
  - name: Auth
    description: Login, session refresh, password reset, bootstrap -- everything needleye-web needs instead of talking to Supabase directly.
  - name: Users
    description: Owner/Manager-only staff administration -- direct account creation with a generated password (no email invite), password/QR-login regeneration, role changes, deactivation.
  - name: Orders
    description: Order CRUD, field-level RBAC, image uploads.
  - name: Payments
    description: Per-order payment ledger. owner_manager/accountant see and manage every order's ledger; designer only their own assigned orders; master_tailor has zero access, enforced at every layer (router capability gate, RLS, and the response never includes payment fields at all).
  - name: Reports
    description: Owner/Manager-only view of the team -- who is Working vs Idle, and the last 7 days of staff activity from the audit trail (payments excluded).
  - name: Team Members
    description: Lightweight designer/master-tailor lookup, backs selects and filters.

security:
  - bearerAuth: []

paths:
  /auth/me:
    get:
      tags: [Auth]
      summary: Get the current caller's profile
      description: |
        Verifies the bearer token against Supabase Auth, then loads the
        matching `profiles` row. Every page in needleye-web calls this once
        (server-side, in `app/(app)/layout.tsx`) to know who's logged in and
        what role they have.
      responses:
        "200":
          description: The caller's profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/bootstrap-status:
    get:
      tags: [Auth]
      summary: Whether an Owner/Manager account already exists
      description: Drives the frontend's `/register` page -- shows the first-time-setup form if `ownerExists` is false, an "invite-only" message otherwise.
      security: []
      responses:
        "200":
          description: Bootstrap status
          content:
            application/json:
              schema:
                type: object
                properties:
                  ownerExists:
                    type: boolean

  /auth/bootstrap:
    post:
      tags: [Auth]
      summary: Create the first Owner/Manager account
      description: |
        Self-disabling: throws 403 the instant one Owner/Manager already
        exists, so it can never be used to self-escalate after go-live.
        Every account after this one is created directly via `POST /users`
        (no email invite -- a password is generated and returned once).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, fullName]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                fullName: { type: string, minLength: 1 }
      responses:
        "201":
          description: Owner/Manager account created
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean, enum: [true] } }
        "403":
          description: An Owner/Manager already exists
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email + password
      description: |
        The only place needleye-web sends a raw password. Returns a fresh
        session; if the account turns out to be inactive, the session is
        immediately revoked again server-side before the error is returned --
        a deactivated user never walks away holding a live token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid email or password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate a refresh token for a new session
      description: |
        Called by needleye-web's `proxy.ts` (on every request, if the access
        token is missing/expired) and by `lib/api/client.ts`/`lib/api/server.ts`
        before any API call whose token has expired. Supabase rotates the
        refresh token itself on every use -- the old one stops working the
        moment a new one is issued.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: New session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      description: |
        Real server-side revocation (`auth.admin.signOut`), not just "the
        client forgets the token" -- a refresh attempt with the same token
        after this call fails with 401. Best-effort: an already-invalid token
        is not treated as an error.
      responses:
        "204": { description: Session revoked }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/password-reset-request:
    post:
      tags: [Auth]
      summary: Request a password-reset email
      description: |
        Always returns 204, whether or not the email matches an account --
        never confirms account existence. The email's link points at
        `${WEB_APP_URL}/auth/callback?next=/update-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        "204": { description: Always -- see description }

  /auth/password-update:
    post:
      tags: [Auth]
      summary: Update the caller's own password
      description: Requires a bearer token (either a normal session, or the session established right after following a password-reset email link).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newPassword]
              properties: { newPassword: { type: string, minLength: 8 } }
      responses:
        "204": { description: Password updated }
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/exchange-code:
    post:
      tags: [Auth]
      summary: Exchange a PKCE code for a session
      description: |
        Only exercised if the Supabase project is configured for the PKCE
        flow (a `?code=` query param on the email link). This project's
        current config uses the *implicit* flow instead (tokens arrive
        directly in the URL fragment), which `app/auth/callback/page.tsx`
        handles client-side without calling this endpoint -- it's kept for
        if that configuration ever changes.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid or expired code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/qr-login:
    post:
      tags: [Auth]
      summary: Sign in via a staff QR login card
      description: |
        Public -- the token comes from the `?token=` query param on the
        scanned QR's URL (`${WEB_APP_URL}/qr-login?token=...`). Internally
        looks up the token's hash against `qr_login_tokens`, then mints a
        real session via Supabase's admin `generateLink` + `verifyOtp`
        (the magic link is never emailed, just redeemed server-side
        immediately) -- see the README's Flow Map. Only ever issued for
        `designer`, `master_tailor`, `production_manager` and `worker`
        accounts (never owner/accountant), so this endpoint needs no role
        check of its own; deactivating an account or regenerating
        its QR immediately invalidates the old token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties: { token: { type: string } }
      responses:
        "200":
          description: Session established
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSession" }
        "401":
          description: Invalid, expired, or revoked QR code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /users:
    get:
      tags: [Users]
      summary: List staff accounts (searchable, paginated)
      description: |
        Owner/Manager only (`users:manage`). Server-side offset pagination and
        search (never loads every account into the client), mirroring the
        Orders list: the response is a bounded envelope
        (`{ users, total, limit, offset }`). `search` matches full name OR
        email, case-insensitively.
      parameters:
        - { in: query, name: search, schema: { type: string }, description: "Case-insensitive match on name or email" }
        - { in: query, name: limit, schema: { type: integer, default: 20, minimum: 1, maximum: 100 }, description: "Clamped to 1-100" }
        - { in: query, name: offset, schema: { type: integer, default: 0, minimum: 0 } }
      responses:
        "200":
          description: A page of users
          content:
            application/json:
              schema:
                type: object
                required: [users, total, limit, offset]
                properties:
                  users:
                    type: array
                    items: { $ref: "#/components/schemas/User" }
                  total: { type: integer, description: "Full count matching the search, for the pager." }
                  limit: { type: integer }
                  offset: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Users]
      summary: Create a staff account directly
      description: |
        Owner/Manager only. No email invite -- the account is created with a
        real password immediately (generated as "readable name + random
        suffix", e.g. `Aditya-9kQ2Xf7q`), returned once in this response.
        The Owner/Manager is responsible for communicating it to the new
        hire. The `handle_new_user()` DB trigger reads `full_name`/`role`
        from the created user's metadata and creates the matching `profiles`
        row automatically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, fullName, role]
              properties:
                email: { type: string, format: email }
                fullName: { type: string, minLength: 1 }
                role: { $ref: "#/components/schemas/Role" }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId: { type: string, format: uuid }
                  password: { type: string, description: "Shown only in this response -- never retrievable again." }
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/generate-password:
    post:
      tags: [Users]
      summary: Regenerate a staff member's password
      description: |
        Owner/Manager only. Always allowed for `designer`/`master_tailor`
        accounts. For `owner_manager`/`accountant` accounts, only allowed
        until that account's first real login (`profiles.last_login_at`) --
        after that they're expected to manage their own password via
        `POST /auth/password-reset-request` instead. The new password is
        returned once, same as account creation.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: Password regenerated
          content:
            application/json:
              schema:
                type: object
                properties: { password: { type: string } }
        "403":
          description: "This owner_manager/accountant account has already completed its first login"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}/qr-token:
    post:
      tags: [Users]
      summary: Generate (or regenerate) a staff member's QR login card
      description: |
        Owner/Manager only, and only for `designer`, `master_tailor`,
        `production_manager` and `worker` accounts -- 400 for `owner_manager`
        and `accountant`, whose pricing/payment/staff powers aren't worth
        exposing to a lost or photographed card. The QR card is an extra way
        in; the account's password login is unaffected. Only the token's
        SHA-256 hash is stored
        (`qr_login_tokens`, a table with no anon/authenticated grant at
        all -- unreachable except through this API's service-role client).
        The raw token/URL is returned once; regenerating immediately
        invalidates whatever QR code was printed/displayed before.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "201":
          description: QR login token generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  loginUrl: { type: string, example: "http://localhost:3000/qr-login?token=..." }
        "400":
          description: "`USER_QR_ROLE_UNSUPPORTED` -- the target account is an owner_manager or accountant"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"

  /users/{id}:
    get:
      tags: [Users]
      summary: Fetch a single staff account
      description: Owner/Manager only. Backs the user detail / management page.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Users]
      summary: Update a staff member's name, role, or active flag
      description: Owner/Manager only. All fields optional; at least one is required.
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName: { type: string, minLength: 1 }
                role: { $ref: "#/components/schemas/Role" }
                active: { type: boolean }
      responses:
        "204": { description: Updated }
        "400":
          description: No fields to update
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/deactivate:
    post:
      tags: [Users]
      summary: Deactivate a staff member
      description: |
        Owner/Manager only. Sets `profiles.active = false` AND bans the
        account at the Supabase Auth layer (`ban_duration`), so the block is
        enforced at sign-in, not just app-level. Also clears any QR login
        token immediately -- a deactivated account's QR must stop working
        right away, not linger. Rejects self-deactivation.
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Deactivated }
        "400":
          description: You cannot deactivate your own account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /users/{id}/reactivate:
    post:
      tags: [Users]
      summary: Reactivate a deactivated staff member
      description: |
        Owner/Manager only. Sets `profiles.active = true` AND lifts the
        Supabase Auth ban applied by deactivation, restoring sign-in. Any QR
        login must be re-issued separately (deactivation cleared the old one).
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "204": { description: Reactivated }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    get:
      tags: [Orders]
      summary: List orders (row-scoped by role, paginated)
      description: |
        Owner/Manager and Accountant see every order; Designer and Master
        Tailor only ever see orders where they're `designerId`/`masterTailorId`
        -- enforced inside the repository's query construction, not just a
        UI filter.

        Offset-paginated: the response is a bounded envelope
        (`{ orders, total, limit, offset }`), not a bare array. `total` is the
        full count matching the filters, for building a pager. `limit` defaults
        to 20 and is capped at 100; `offset` defaults to 0.
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/GranularStatus" }
        - name: designerId
          in: query
          schema: { type: string, format: uuid }
        - name: masterTailorId
          in: query
          schema: { type: string, format: uuid }
        - name: bucket
          in: query
          description: |
            Dashboard filter a summary card deep-links into. One of:
            `active`, `production`, `completed`, `ready`, `delivered`,
            `pending_payment`, `overdue`, `urgent`, `this_month`.
            Unknown values are ignored (no filtering).
          schema:
            type: string
            enum: [active, production, completed, ready, delivered, pending_payment, payment_overdue, payment_upcoming, overdue, urgent, this_month]
        - name: limit
          in: query
          description: Page size. Defaults to 20, clamped to a maximum of 100.
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: offset
          in: query
          description: Number of orders to skip. Defaults to 0.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: createdFrom
          in: query
          description: >
            Only orders created on or after this day (midnight in the shop's
            timezone, BUSINESS_TIMEZONE). The web's Kanban board sends today
            minus 2 months with limit=50 to page through the recent board. A
            date that isn't real (e.g. 2026-02-31) is a 400.
          schema: { type: string, format: date }
        - name: dueOn
          in: query
          description: >
            Only orders DUE on this day -- the delivery calendar's list of one
            day's deliveries (owner / production manager dashboard). Row-scoped
            like the rest of the list. A date that isn't real is a 400.
          schema: { type: string, format: date }
      responses:
        "200":
          description: A page of orders visible to the caller, plus the total count
          content:
            application/json:
              schema:
                type: object
                required: [orders, total, limit, offset]
                properties:
                  orders:
                    type: array
                    items: { $ref: "#/components/schemas/OrderListItem" }
                  total:
                    type: integer
                    description: Total orders matching the filters, ignoring pagination.
                  limit: { type: integer }
                  offset: { type: integer }
        "403":
          $ref: "#/components/responses/Forbidden"

    post:
      tags: [Orders]
      summary: Create an order
      description: |
        Owner/Manager, Designer and Production Manager (`orders:create`).

        **Delivery-day capacity.** If `DELIVERY_DAY_CAPACITY` (default 10)
        orders are already due on `dueDate`, the create is refused with 409
        `DELIVERY_DAY_FULL` unless `confirmedWithProductionManager: true` is
        sent -- in which case it's booked and audited as
        `order.delivery_override`. The check and the insert run under a
        per-date lock, so two people booking a day's last slot at once can't
        both get it. See `GET /orders/delivery-load`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                type: object
                properties: { order: { $ref: "#/components/schemas/Order" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            `DELIVERY_DAY_FULL` -- the due date is at capacity and
            `confirmedWithProductionManager` wasn't sent. `details` carries
            `{ dueDate, booked, capacity }`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/delivery-load:
    get:
      tags: [Orders]
      summary: Orders due per day -- for the delivery calendar and availability check
      description: |
        How many orders are due on each day in `[from, to]`, SHOP-WIDE: not
        row-scoped, because delivery capacity is shop-wide and this returns only
        counts, never order details. Days with no orders are omitted (read a
        missing day as 0). `capacity` / `nearCapacity` come from the server so
        clients never hard-code them: a day at or above `capacity` is full
        (red), at or above `nearCapacity` is filling up (amber), otherwise open.
        Gated on `orders:create` -- the roles that pick due dates. A malformed
        or over-long range is a 400 rather than silently defaulted.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, description: "Inclusive; at most 200 days after `from`.", schema: { type: string, format: date } }
        - { name: excludeOrderId, in: query, required: false, description: "Leave one order out of the counts -- the order being edited, so it doesn't count against its own day.", schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Per-day counts plus thresholds
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryLoad" }
        "400":
          description: Not a real date, `to` before `from`, or a span over 200 days
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/stats:
    get:
      tags: [Orders]
      summary: Dashboard aggregates for the caller's row scope
      description: |
        Registered before `/orders/{id}` -- Express would otherwise match
        `stats` as `:id`. Counts/sums are computed in Postgres (COUNT/SUM
        FILTER), never by fetching every order into Node. `pendingPayments`,
        `collectedRevenue`, and `outstandingRevenue` are absent entirely
        (not zero) for callers without `payments:read` (master_tailor) --
        the same real server-side omission `Order`'s own payment fields get.
      responses:
        "200":
          description: Aggregates scoped to the caller's role (row-scoped the same way GET /orders is)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderStats" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/revenue:
    get:
      tags: [Orders]
      summary: Monthly collected-revenue report over a date range
      description: |
        Owner/Manager and Accountant only (`reports:financial`). Collected
        revenue grouped into accounting periods over an inclusive `[from, to]`
        window (the UI sends a whole-year span), oldest period first. Period
        boundaries follow `ACCOUNTING_CYCLE_START_DAY` (1 = calendar months by
        default; e.g. 7 gives 7th-to-6th cycles). Computed in Postgres from the
        `payments` ledger. Registered before `/orders/{id}` for the same
        reason `stats` is. Defaults to the last 12 months when the range is
        missing/invalid.
      parameters:
        - name: from
          in: query
          description: Inclusive start date (YYYY-MM-DD). Defaults to the first of the month 11 months ago.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive end date (YYYY-MM-DD). Defaults to today.
          schema: { type: string, format: date }
      responses:
        "200":
          description: The revenue report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevenueReport" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/staff-report:
    get:
      tags: [Orders]
      summary: One designer/master-tailor's weekly workload report
      description: |
        Owner/Manager only (`reports:staff` -- NOT the accountant). Loads ONE
        person's report on demand (the UI drills down role -> person -> here),
        so all-staff aggregation never runs. Computed live from `orders`
        (+ `order_status_history` for weekly completion) over a rolling window;
        nothing is stored/deleted. Registered before `/orders/{id}` so
        `staff-report` isn't matched as an order id.
      parameters:
        - name: staffId
          in: query
          required: true
          description: An ACTIVE designer or master_tailor profile id.
          schema: { type: string, format: uuid }
        - name: month
          in: query
          description: The month (YYYY-MM) the weekly breakdown covers. Defaults to the current month; the UI offers the last 6 months and fetches per selection.
          schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" }
      responses:
        "200":
          description: The staff report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffReport" }
        "400":
          description: staffId is required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No active designer/master_tailor with that id
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/ledger-events:
    get:
      tags: [Orders]
      summary: Payment-ledger activity feed (audit trail)
      description: |
        Owner/Manager and Accountant only (`reports:financial`). The
        append-only payment audit trail over an inclusive `[from, to]` window:
        every payment recorded / edited / removed, newest first, decoded into a
        display shape (who did it, when, on which order, and what changed --
        before/after amounts for an edit, a signed amount for a
        record/removal). Read from `audit_log` (`entity_type = 'payment'`);
        nothing is mutated. Paginated (the revenue page's year/month/week
        filters map to a `[from, to]` here). Registered before `/orders/{id}`
        so `ledger-events` isn't matched as an order id. Defaults to the last
        12 months when the range is missing/invalid.
      parameters:
        - name: from
          in: query
          description: Inclusive start date (YYYY-MM-DD). Defaults to the first of the month 11 months ago.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive end date (YYYY-MM-DD). Defaults to today.
          schema: { type: string, format: date }
        - name: limit
          in: query
          description: Page size (default 20, max 100).
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: offset
          in: query
          description: Rows to skip for pagination.
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The ledger-activity feed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LedgerEventsResult" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get a single order
      description: |
        In-scope readers (owner/accountant on any order; a designer/master on
        their own) get the full order. An authenticated OUTSIDER (a
        designer/master reaching a non-assigned order via QR/link) gets a
        read-only view -- the same 200, but payment fields
        (paymentStatus/totalAmount/amountPaid/outstanding) are stripped, and
        writes (status/edit/payment ledger) stay 403. A truly missing order is
        404. The list endpoint stays row-scoped -- outsiders can reach one order
        by id, not browse everyone's.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema:
                type: object
                properties: { order: { $ref: "#/components/schemas/Order" } }
        "404":
          $ref: "#/components/responses/NotFound"

    patch:
      tags: [Orders]
      summary: Edit an order
      description: |
        The core field-level RBAC: customer/product fields
        (`orders:edit:customer_product_fields`) and pricing/assignment fields
        (`totalAmount`, `designerId`, `masterTailorId`, gated by
        `orders:edit:pricing_assignment`) are checked *independently* -- a
        Designer can edit their own order's notes but gets 403 touching
        `totalAmount`. `productionStatus` is accepted by the request schema
        but silently stripped by the controller before it reaches the service
        -- status changes go through `PATCH /orders/{id}/status` instead,
        which enforces design-stage vs production-stage RBAC. Changing
        `totalAmount` re-derives the payment status from the ledger, and is
        rejected (400 `ORDER_TOTAL_BELOW_PAID`) if the new total would fall
        below what's already been recorded in the ledger (which would leave the
        order "overpaid") -- the mirror of the payment-side overpayment guard.

        Moving `dueDate` onto a day already at capacity is refused with 409
        `DELIVERY_DAY_FULL` unless `confirmedWithProductionManager: true` is
        sent (then audited as `order.delivery_override`). Resending the order's
        CURRENT due date is never checked -- clients send every field on edit,
        and an order already on a full day must stay editable.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderRequest" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                type: object
                properties: { order: { $ref: "#/components/schemas/Order" } }
        "400":
          description: "No editable fields, or the new totalAmount is below the collected ledger sum (ORDER_TOTAL_BELOW_PAID)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `ORDER_MODIFIED` -- `version` no longer matches (someone else edited
            first); or `DELIVERY_DAY_FULL` -- the new due date is at capacity and
            `confirmedWithProductionManager` wasn't sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Change an order's production status
      description: |
        Tiered stage RBAC, not the flat `orders:edit:*` capabilities. Each stage
        belongs to one capability tier, and the caller's ROLE alone decides
        whether they may move an order into it -- assignment is never
        considered (whoever receives the garment on the floor advances it):

        | Tier | Stages | Roles |
        |---|---|---|
        | `orders:status:design` | Design Pending, Design Approved | owner, designer, PM |
        | `orders:status:pm_received` | Production Manager Received | owner, PM |
        | `orders:status:production` | Falls/Kutchu ... Finishing | owner, designer, PM, master tailor, worker |
        | `orders:status:finalization` | Quality Check / Trail, Alteration, Delivered | owner, designer, PM |

        **No skipping past a gated stage.** A forward jump may pass over
        intermediate stages only if the caller could have set each of them --
        so a designer can't go Design Approved -> Falls/Kutchu over PM Received,
        but anyone can skip Hand Work on an order that doesn't need it.

        **Forward-only.** Moving to the current or an earlier stage is a 409.
        The order row is locked for the whole check-and-write, so two people
        advancing the same order at once serialise (the loser gets the 409),
        and the forward-only + no-skip checks run against the locked stage.

        Deliberately not gated by a `requireCapability` middleware call -- the
        capability depends on the *target* status in the body -- so the
        decision lives in the domain layer (`order-status.rules.ts`:
        `assertCanChangeStage` + `assertCanSkipStages`). Appends one row to the
        order's status history in the same transaction as the update.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateOrderStatusRequest" }
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                type: object
                properties: { order: { $ref: "#/components/schemas/Order" } }
        "403":
          description: >-
            `ORDER_STATUS_TRANSITION_FORBIDDEN` -- the caller's role can't set the
            target stage, or the move would skip over a stage it can't set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: >-
            `ORDER_STATUS_NOT_FORWARD` -- the target is the order's current stage
            or an earlier one (also what the loser of a concurrent advance gets).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{id}/history:
    get:
      tags: [Orders]
      summary: List an order's status-change audit trail
      description: Newest first. Each entry's `label` is a frozen snapshot of the status's label at the time of the change, not recomputed from the current vocabulary.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Status history entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items: { $ref: "#/components/schemas/OrderStatusHistoryEntry" }
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{id}/images:
    post:
      tags: [Orders]
      summary: Upload a reference image into one of the 4 slots
      description: Gated by `orders:edit:customer_product_fields` (same permission as editing the order's content fields). `multipart/form-data`, max 10MB, one of 4 slots.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [slot, file]
              properties:
                slot: { type: integer, minimum: 1, maximum: 4 }
                file: { type: string, format: binary }
      responses:
        "201":
          description: Image stored, returns a fresh signed URL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrderImage" }
        "400":
          description: Invalid slot, missing file, or unsupported content type
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

  /orders/{id}/images/{slot}:
    delete:
      tags: [Orders]
      summary: Remove an image from a slot
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - name: slot
          in: path
          required: true
          schema: { type: integer, minimum: 1, maximum: 4 }
      responses:
        "204": { description: Removed }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders/{orderId}/payments:
    get:
      tags: [Payments]
      summary: List an order's payment ledger
      description: Gated by `payments:read` at the router level; a scoped (designer) caller additionally must be the order's designer, checked in the service.
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      responses:
        "200":
          description: Ledger entries, most recent paid_at first
          content:
            application/json:
              schema:
                type: object
                properties:
                  payments:
                    type: array
                    items: { $ref: "#/components/schemas/Payment" }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

    post:
      tags: [Payments]
      summary: Record a payment
      description: |
        Gated by `payments:manage`. Rejected with 400 `PAYMENT_EXCEEDS_TOTAL`
        if the resulting ledger sum would exceed `total_amount` (overpayment).
        After recording, the order's DERIVED payment status is recomputed and
        synced (unpaid -> advance_paid -> fully_paid), and its `nextPaymentDate`
        is rescheduled: cleared once fully paid, or set to the request's
        `nextPaymentDate` while a balance remains.
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePaymentRequest" }
      responses:
        "201":
          description: Payment recorded
          content:
            application/json:
              schema:
                type: object
                properties: { payment: { $ref: "#/components/schemas/Payment" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Would leave a fully_paid order's ledger not matching its total_amount
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /orders/{orderId}/payments/{paymentId}:
    patch:
      tags: [Payments]
      summary: Edit a payment entry
      description: Same `fully_paid` consistency rule as POST, evaluated against the edited amount.
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
        - $ref: "#/components/parameters/PaymentId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdatePaymentRequest" }
      responses:
        "200":
          description: Updated payment
          content:
            application/json:
              schema:
                type: object
                properties: { payment: { $ref: "#/components/schemas/Payment" } }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Would leave a fully_paid order's ledger not matching its total_amount
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

    delete:
      tags: [Payments]
      summary: Remove a payment entry
      description: Rejected with 409 if the order is `fully_paid` and removing this entry would break the ledger-sum-equals-total_amount invariant -- change the order's payment status first if that's intentional.
      parameters:
        - $ref: "#/components/parameters/OrderIdPath"
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "204": { description: Removed }
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Would leave a fully_paid order's ledger not matching its total_amount
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /team-members:
    get:
      tags: [Team Members]
      summary: Lightweight designer/master-tailor lookup
      description: Backs the designer/master-tailor selects on the order form and the filter dropdowns on the orders list. Any authenticated role can read it (no capability gate beyond `requireAuth`).
      parameters:
        - name: role
          in: query
          schema: { $ref: "#/components/schemas/Role" }
      responses:
        "200":
          description: Active team members, optionally filtered by role
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/TeamMember" }

  /reports/staff-activity:
    get:
      tags: [Reports]
      summary: Working / Idle staff -- searched, filtered and paged in the database
      description: |
        Owner/Manager only (`reports:staff`). The owner and accountant are never
        listed. A **designer** is `working` while they have *created* an
        undelivered order in the last `windows.designerDays` (45) days; a
        **master tailor, production manager or worker** while they made the
        *most recent* stage move on an undelivered order in the last
        `windows.floorDays` (30) days. `counts` (the summary tiles) cover the
        search + role filters but ignore `status`; `total` counts every filter.
        Ordered Working first, then role, then most orders in hand, then name.
        Also backs the Staff Report's person picker (`role=designer` /
        `master_tailor`). One query per page, whatever its size.
      parameters:
        - { name: q, in: query, required: false, description: "Name contains (case-insensitive; % and _ are literal). Max 100 chars.", schema: { type: string, maxLength: 100 } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [designer, master_tailor, production_manager, worker] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [working, idle] } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: One page of staff, plus totals
          content:
            application/json:
              schema: { : "#/components/schemas/StaffActivity" }
        "400":
          description: A limit over 50, an unknown role/status, or a search over 100 characters
          content:
            application/json:
              schema: { : "#/components/schemas/Error" }
        "401":
          : "#/components/responses/Unauthorized"
        "403":
          : "#/components/responses/Forbidden"

  /reports/activity-days:
    get:
      tags: [Reports]
      summary: The 7 days the activity feed covers
      description: |
        Owner/Manager only. Today and the 6 days before it, newest first,
        computed in the shop's timezone (`BUSINESS_TIMEZONE`, default
        Asia/Kolkata). No data: the client loads each day on demand with
        `GET /reports/activity`.
      responses:
        "200":
          description: The day list
          content:
            application/json:
              schema:
                type: object
                required: [timeZone, today, days]
                properties:
                  timeZone: { type: string, example: Asia/Kolkata }
                  today: { type: string, format: date }
                  days: { type: array, items: { type: string, format: date }, minItems: 7, maxItems: 7 }
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/activity:
    get:
      tags: [Reports]
      summary: One day of staff activity from the audit trail (payments excluded)
      description: |
        Owner/Manager only. Every audited action on `day` (midnight to midnight
        in the shop's timezone), newest first, paginated. `payment.*` events are
        left out: those are the Revenue & Ledger feed. A day outside the last 7
        is a 400. Each event carries the actor's name and role, plus the order's
        number (order events) or the account's name (user events).
      parameters:
        - { name: day, in: query, required: true, schema: { type: string, format: date } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: offset, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: A page of that day's events, plus the day's total
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ActivityDay" }
        "400":
          description: Not a real date, or not one of the last 7 days
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-issued access token, obtained from `POST /auth/login` (or `/refresh`, `/exchange-code`). Verified independently on every request -- see `common/middleware/auth.middleware.ts`.

  parameters:
    OrderId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PaymentId:
      name: paymentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    UserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated, but the caller's role/scope doesn't allow this
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found (or outside the caller's row scope)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Money:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      example: "1500.00"
      description: >
        A monetary amount. Money crosses every boundary as a STRING with
        exactly two decimals ("1500.00"), never a JSON number -- JSON numbers
        are IEEE-754 floats and can drift, a string is exact. The server uses
        decimal.js (see src/common/money/money.ts); clients should treat these
        as opaque decimal strings and never parse them into floats for
        arithmetic. Currency is INR.
    MoneyInput:
      oneOf:
        - type: string
          pattern: '^\d+(\.\d{1,2})?$'
        - type: number
          minimum: 0
      example: "1500.00"
      description: >
        Money coming IN over the wire. Prefer a decimal string ("1500.00"); a
        JSON number is also accepted for convenience. The server validates and
        normalises it to a canonical 2-decimal string (see
        src/common/money/money-schema.ts).
    Error:
      type: object
      description: >
        The one shape every error response takes, produced by
        common/middleware/error.middleware.ts regardless of which layer threw.
        `code` is a stable application error code from the ERROR_CODES registry
        (common/errors/error-codes.ts) -- clients should branch on `code`, not
        on `error` (the human message, which may change). `requestId` correlates
        the response with the server logs. Auth endpoints additionally return
        `429` with code `RATE_LIMITED` when the brute-force limit is exceeded.
      properties:
        error: { type: string }
        code: { type: string, example: ORDER_NOT_FOUND }
        details: {}
        requestId: { type: string, description: Correlates this response with the server logs. }

    Role:
      type: string
      enum: [owner_manager, designer, master_tailor, accountant, production_manager, worker]

    GranularStatus:
      type: string
      description: >
        The 14-stage, forward-only production flow. `orders.production_status`
        always stores one of these. Moving into a stage is gated by role tier
        (design / pm_received / production / finalization) -- not by
        assignment -- can only move forward, and can't skip past a stage the
        role couldn't set (see PATCH /orders/{id}/status).
      enum:
        - design_pending
        - design_approved
        - production_manager_received
        - falls_kutchu
        - fabric_purchased
        - dyeing
        - cutting
        - stitching
        - hand_work
        - machine_work
        - finishing
        - quality_check
        - alteration
        - delivered

    ProductCategory:
      type: string
      description: >
        The product catalogue -- 47 stored values in 6 collections (Upper Body,
        Full Body, Lower Body, Mens Wear, Kids Wear - Girls, Kids Wear - Boys);
        labels and collections live in `src/domain/product-categories.ts`. This
        is a stored VALUE, never a display label ("saree", not "Saree"). Mens
        Wear and Kids Wear values carry a `mens_` / `kids_` prefix, which is how
        the labels that appear twice stay distinct (`shirt` vs `mens_shirt`,
        `pant` vs `mens_pant`, `skirt` vs `mens_skirt`). Validated by the API only -- the database has no
        CHECK on this column since migration 20260924000002.
      enum:
        # Upper Body
        - saree_blouse
        - work_blouse
        - crop_top_blouse
        - corset
        - shirt
        - designer_blouse
        - hw_blouse_skirt
        - short_kurta
        - pakistani_kurta
        - custom_upper_body
        # Full Body
        - anarkali
        - gown
        - jumpsuit
        - bodycon
        - drape_gown
        - bridal_lehenga
        - saree
        - custom_ethnic_wear
        - boutique_fashion
        # Lower Body
        - skirt
        - half_saree
        - divided_skirt
        - palazzo
        - pant
        - sharara
        - pakistani_pant
        - drape_skirt
        - mermaid_skirt
        - petticoat
        - custom_lower_body
        # Mens Wear
        - mens_shirt
        - mens_pant
        - mens_skirt
        - mens_shalwar
        - mens_blazer
        - mens_waist_coat
        - mens_bandi
        - mens_three_piece_set
        - mens_dhoti
        - mens_kurta
        - mens_prince_coat
        - mens_panchay
        - mens_shalya
        - mens_indo_western
        - mens_custom
        # Kids Wear
        - kids_girls_custom
        - kids_boys_custom

    PaymentStatus:
      type: string
      description: DERIVED from the ledger (sum of payments vs order total), never submitted. unpaid -> advance_paid -> fully_paid.
      enum: [unpaid, advance_paid, fully_paid]

    PaymentMethod:
      type: string
      enum: [cash, card, upi, bank_transfer, cheque, other]

    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }

    AuthSession:
      type: object
      description: Returned by login/refresh/exchange-code. Tokens only ever appear in this response body -- the API never sets a cookie itself.
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresAt: { type: integer, description: Unix seconds }
        profile: { $ref: "#/components/schemas/Profile" }

    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        role: { $ref: "#/components/schemas/Role" }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time, nullable: true, description: "Gates whether generate-password stays available for owner_manager/accountant accounts." }
        hasQrLogin: { type: boolean, description: "Whether a QR login token exists. Never the token/hash itself." }

    TeamMember:
      type: object
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        amount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: Always > 0 -- a correction is a payment update/delete, not a negative entry.
        method: { $ref: "#/components/schemas/PaymentMethod" }
        paidAt: { type: string, format: date }
        recordedBy: { type: string, format: uuid, nullable: true }
        recordedByName: { type: string }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    CreatePaymentRequest:
      type: object
      required: [amount, method]
      properties:
        amount: { $ref: "#/components/schemas/MoneyInput" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        paidAt: { type: string, format: date, description: Defaults to today if omitted. }
        notes: { type: string }
        nextPaymentDate:
          type: string
          format: date
          nullable: true
          description: "When the next payment is expected if a balance remains (reschedules the order's due tracking). Null clears it; ignored once fully paid (always cleared)."

    UpdatePaymentRequest:
      type: object
      description: Every field from CreatePaymentRequest, but optional (partial update).
      properties:
        amount: { $ref: "#/components/schemas/MoneyInput" }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        paidAt: { type: string, format: date }
        notes: { type: string }

    UpdateOrderStatusRequest:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/GranularStatus" }

    OrderStatusHistoryEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/GranularStatus" }
        label: { type: string, description: Snapshot of the status's label at the time of the change. }
        changedBy: { type: string, format: uuid, nullable: true }
        changedByName: { type: string }
        createdAt: { type: string, format: date-time }

    OrderImage:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        slot: { type: integer, minimum: 1, maximum: 4 }
        storagePath: { type: string }
        url: { type: string, description: Freshly-signed Supabase Storage URL, re-resolved on every read -- never stored. }
        originalFilename: { type: string, nullable: true }
        contentType: { type: string, nullable: true }
        sizeBytes: { type: integer, nullable: true }
        uploadedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }

    OrderListItem:
      description: |
        A row of `GET /orders`: every `Order` field **except `images`**. No
        list screen shows photos, and each photo would need a signed URL from
        storage, so lists skip them entirely (no image query, no storage call).
        `GET /orders/{id}` returns the full order with signed image URLs.
      allOf:
        - { $ref: "#/components/schemas/Order" }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        orderNumber: { type: string, example: ORD-2026-014 }
        customerName: { type: string }
        phone: { type: string }
        billNumber: { type: string }
        bookingDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        designerId: { type: string, format: uuid }
        designerName: { type: string }
        masterTailorId: { type: string, format: uuid }
        masterTailorName: { type: string }
        productCategory: { $ref: "#/components/schemas/ProductCategory" }
        orderDetails: { type: string }
        handWork: { type: boolean }
        machineWork: { type: boolean }
        purchaseRequired: { type: boolean }
        paymentStatus:
          allOf: [{ $ref: "#/components/schemas/PaymentStatus" }]
          description: Derived from the ledger (never submitted). Absent entirely (not null) for callers without payments:read (master_tailor) -- a real server-side omission, not a UI-only hide.
        totalAmount:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "Absent for master_tailor -- see paymentStatus."
        amountPaid:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "Absent for master_tailor. The real sum of GET /orders/{orderId}/payments -- never stored, always derived at read time."
        outstanding:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "Absent for master_tailor -- see paymentStatus."
        nextPaymentDate:
          type: string
          format: date
          nullable: true
          description: "When the next payment is expected (payment-due tracking). Null when unset or fully paid. Visible to all roles."
        productionStatus: { $ref: "#/components/schemas/GranularStatus" }
        designerInstructions: { type: string, nullable: true }
        specialNotes: { type: string, nullable: true }
        images:
          type: array
          items: { $ref: "#/components/schemas/OrderImage" }
        version: { type: integer, description: "Optimistic-lock version. Echo it back in PATCH /orders/:id to be told (409 ORDER_MODIFIED) if someone else edited the order first." }
        createdBy: { type: string, format: uuid, nullable: true }
        updatedBy: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    OrderStats:
      type: object
      properties:
        total: { type: integer, description: Every order in the caller's row scope. }
        active: { type: integer, description: "Not yet in a completed canonical stage (ready_for_delivery/delivered)." }
        completed: { type: integer, description: In the ready_for_delivery or delivered canonical stage. }
        thisMonth: { type: integer, description: "Orders created in the current calendar month. Visible to all roles." }
        inProduction: { type: integer, description: "Orders in an active production stage (cutting..QC, excluding ready/delivered). Visible to all roles." }
        overdue: { type: integer, description: "Active orders past their delivery due date. Visible to all roles." }
        urgent: { type: integer, description: "Active orders due within 3 days (not overdue). Visible to all roles." }
        pendingPayments: { type: integer, description: "Absent for master_tailor. Orders whose paymentStatus isn't fully_paid." }
        collectedRevenue:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "Absent for master_tailor. SUM(payments.amount) across the scope."
        outstandingRevenue:
          allOf: [{ $ref: "#/components/schemas/Money" }]
          description: "Absent for master_tailor. SUM(orders.total_amount) - collectedRevenue, floored at 0."

    RevenueReport:
      type: object
      description: Monthly collected-revenue report from GET /orders/revenue (reports:financial).
      properties:
        cycleStartDay: { type: integer, minimum: 1, maximum: 28, description: "Day of month each accounting period begins (ACCOUNTING_CYCLE_START_DAY; 1 = calendar months)." }
        from: { type: string, format: date, description: Inclusive start of the requested window (echoed from the request). }
        to: { type: string, format: date, description: Inclusive end of the requested window (echoed from the request). }
        periods:
          type: array
          description: Accounting periods, oldest first.
          items:
            type: object
            properties:
              periodStart: { type: string, format: date, description: First day of the accounting period. }
              collected:
                allOf: [{ $ref: "#/components/schemas/Money" }]
                description: SUM(payments.amount) with paid_at in this period.
              paymentCount: { type: integer, description: Number of ledger entries in this period. }

    StaffReport:
      type: object
      description: One designer/master-tailor's workload report from GET /orders/staff-report (reports:staff).
      properties:
        staff:
          type: object
          properties:
            id: { type: string, format: uuid }
            fullName: { type: string }
            role: { type: string, enum: [designer, master_tailor] }
        summary:
          type: object
          description: The current status of the orders they BOOKED in the selected month (the month's cohort).
          properties:
            booked: { type: integer, description: Orders they booked in the month (cohort size). }
            active: { type: integer }
            inProduction: { type: integer }
            completed: { type: integer, description: Orders currently in a completed stage (ready/delivered). }
            overdue: { type: integer }
            urgent: { type: integer }
            paymentPendingCount: { type: integer }
            paymentPendingAmount:
              allOf: [{ $ref: "#/components/schemas/Money" }]
              description: Sum of outstanding across their not-fully-paid orders.
        weekly:
          type: array
          description: The selected month's weeks, oldest first, zero-filled and continuous.
          items:
            type: object
            properties:
              weekStart: { type: string, format: date, description: Monday of the week. }
              booked: { type: integer, description: Orders whose booking date falls in that week. }
              completed: { type: integer, description: Orders that reached a completed stage that week. }
        month: { type: string, description: "The month (YYYY-MM) the weekly breakdown covers (echoes the request; default current month)." }

    LedgerAmountSnapshot:
      type: object
      description: A payment's amount + method at a point in time.
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        method: { type: string, description: "cash | card | upi | bank_transfer | cheque | other" }

    LedgerEvent:
      type: object
      description: One payment-ledger audit event, decoded for display.
      properties:
        id: { type: string, format: uuid, description: The audit_log row id. }
        action: { type: string, enum: [created, updated, deleted], description: "created = recorded, updated = edited, deleted = removed." }
        at: { type: string, format: date-time, description: When the action happened (UTC). }
        actorName: { type: string, nullable: true, description: Who did it (null if that account was since removed). }
        orderId: { type: string, format: uuid, nullable: true }
        orderNumber: { type: string, nullable: true, description: Human-readable order number (null if the order was since removed). }
        snapshot:
          allOf: [{ $ref: "#/components/schemas/LedgerAmountSnapshot" }]
          nullable: true
          description: created/deleted only -- the payment's amount + method.
        before:
          allOf: [{ $ref: "#/components/schemas/LedgerAmountSnapshot" }]
          nullable: true
          description: updated only -- values before the edit.
        after:
          allOf: [{ $ref: "#/components/schemas/LedgerAmountSnapshot" }]
          nullable: true
          description: updated only -- values after the edit.

    LedgerEventsResult:
      type: object
      description: Paginated payment-ledger activity feed from GET /orders/ledger-events (reports:financial).
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/LedgerEvent" }
        total: { type: integer, description: Total events matching the range, ignoring pagination. }
        limit: { type: integer }
        offset: { type: integer }
        from: { type: string, format: date, description: Inclusive window start (echoes the resolved request). }
        to: { type: string, format: date, description: Inclusive window end. }

    CreateOrderRequest:
      type: object
      required:
        - customerName
        - phone
        - billNumber
        - dueDate
        - designerId
        - masterTailorId
        - productCategory
        - orderDetails
        - productionStatus
      properties:
        customerName: { type: string }
        phone: { type: string, pattern: "^\\d{10}$" }
        billNumber: { type: string }
        bookingDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        designerId: { type: string, format: uuid }
        masterTailorId: { type: string, format: uuid }
        productCategory: { $ref: "#/components/schemas/ProductCategory" }
        orderDetails: { type: string }
        handWork: { type: boolean, default: false }
        machineWork: { type: boolean, default: false }
        purchaseRequired: { type: boolean, default: false }
        # paymentStatus is NOT accepted -- it is derived from the ledger. Record
        # an advance via POST /orders/{orderId}/payments right after creation.
        totalAmount:
          allOf: [{ $ref: "#/components/schemas/MoneyInput" }]
          default: "0.00"
        nextPaymentDate: { type: string, format: date, nullable: true, description: "When the next payment is expected (payment-due tracking). Optional; null to leave unset." }
        productionStatus: { $ref: "#/components/schemas/GranularStatus" }
        designerInstructions: { type: string }
        specialNotes: { type: string }
        confirmedWithProductionManager:
          type: boolean
          description: >-
            Not stored on the order. The creator's acknowledgement that the due
            date's day is full and the Production Manager agreed to take it
            anyway -- required to book a full day (else 409 DELIVERY_DAY_FULL),
            and audited as order.delivery_override when used.

    UpdateOrderRequest:
      type: object
      description: |
        Every field from CreateOrderRequest, but optional (partial update) --
        deliberately a single role-agnostic schema rather than one per role.
        Which fields a given caller is actually allowed to touch is enforced
        by the service layer's RBAC field-splitting (see PATCH /orders/{id}),
        not by this schema. `productionStatus` is accepted here but the
        controller strips it before the service ever sees it.
      properties:
        customerName: { type: string }
        phone: { type: string, pattern: "^\\d{10}$" }
        billNumber: { type: string }
        bookingDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        designerId: { type: string, format: uuid }
        masterTailorId: { type: string, format: uuid }
        productCategory: { $ref: "#/components/schemas/ProductCategory" }
        orderDetails: { type: string }
        handWork: { type: boolean }
        machineWork: { type: boolean }
        purchaseRequired: { type: boolean }
        # paymentStatus is NOT accepted -- derived from the ledger. Changing
        # totalAmount re-derives it server-side; record payments via the ledger.
        totalAmount: { $ref: "#/components/schemas/MoneyInput" }
        nextPaymentDate: { type: string, format: date, nullable: true, description: "When the next payment is expected (payment-due tracking). Null to clear." }
        productionStatus: { $ref: "#/components/schemas/GranularStatus" }
        designerInstructions: { type: string }
        specialNotes: { type: string }
        version: { type: integer, minimum: 0, description: "Optimistic-lock token: the `version` the order was loaded with. If it no longer matches (someone else edited first), the update is rejected with 409 ORDER_MODIFIED. Optional; omit to update unconditionally." }
        confirmedWithProductionManager:
          type: boolean
          description: "Same as on CreateOrderRequest: required to MOVE the order onto a full delivery day; audited when used. Not stored."

    StaffActivity:
      type: object
      required: [windows, counts, staff, total, limit, offset]
      properties:
        counts:
          type: object
          required: [working, idle]
          description: Working / Idle across the search + role filters (ignores status).
          properties:
            working: { type: integer }
            idle: { type: integer }
        total: { type: integer, description: Rows matching every filter. }
        limit: { type: integer }
        offset: { type: integer }
        windows:
          type: object
          required: [designerDays, floorDays]
          properties:
            designerDays: { type: integer, example: 45 }
            floorDays: { type: integer, example: 30 }
        staff:
          type: array
          items:
            type: object
            required: [id, fullName, role, status, openOrders, lastWorkAt, lastSeenAt]
            properties:
              id: { type: string, format: uuid }
              fullName: { type: string }
              role: { type: string, enum: [designer, master_tailor, production_manager, worker] }
              status: { type: string, enum: [working, idle] }
              openOrders: { type: integer, minimum: 0 }
              lastWorkAt: { type: string, format: date-time, nullable: true, description: "Latest qualifying event (order created / stage move)." }
              lastSeenAt: { type: string, format: date-time, nullable: true, description: "Latest audited action of any kind." }
    ActivityDay:
      type: object
      required: [day, timeZone, events, total, limit, offset]
      properties:
        day: { type: string, format: date }
        timeZone: { type: string, example: Asia/Kolkata }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        events:
          type: array
          items:
            type: object
            required: [id, action, entityType, at]
            properties:
              id: { type: string, format: uuid }
              action: { type: string, example: order.status_changed, description: "Dotted audit code; never payment.*." }
              entityType: { type: string, example: order }
              entityId: { type: string, nullable: true }
              at: { type: string, format: date-time }
              actorName: { type: string, nullable: true }
              actorRole: { type: string, nullable: true }
              orderNumber: { type: string, nullable: true }
              targetName: { type: string, nullable: true, description: "For user events: the account acted on." }
              metadata: { type: object, nullable: true, additionalProperties: true }
    DeliveryLoad:
      type: object
      required: [capacity, nearCapacity, days]
      properties:
        capacity: { type: integer, example: 10, description: "DELIVERY_DAY_CAPACITY -- a day at or above this is full." }
        nearCapacity: { type: integer, example: 8, description: "80% of capacity, rounded up -- a day at or above this is filling up." }
        days:
          type: array
          description: Only days with at least one order, ascending. A missing day means 0.
          items:
            type: object
            required: [date, count]
            properties:
              date: { type: string, format: date }
              count: { type: integer, minimum: 1 }
